version: '3.8'

services:
  vllm-server:
    # Imagen oficial de vLLM v0.23.0 fijada para compatibilidad con parches Genesis y Qwen 3.5 MoE
    image: vllm/vllm-openai:v0.23.0
    container_name: genesis-kat-coder
    restart: "no"
    ports:
      # Puerto API HTTP OpenAI expuesto localmente
      - "8320:8320"
    networks:
      lanbridge:
        # IPs estáticas interna IPv4 e IPv6
        ipv4_address: 172.20.0.228
        ipv6_address: fd00:172:20::13
    volumes:
      # Caché de pesas del modelo de HuggingFace en el host (evita re-descargas)
      - /home/usuario/Proyectos/club-3090/models-cache:/root/.cache/huggingface
      # Persistencia de cachés JIT vLLM, PyTorch, Triton y Inductor
      - /home/usuario/.cache/vllm/kat-coder-v25:/root/.cache/vllm
      - /home/usuario/.cache/torch/kat-coder-v25:/root/.cache/torch
      - /home/usuario/.cache/triton/kat-coder-v25:/root/.cache/triton
      - /home/usuario/.cache/torchinductor/kat-coder-v25:/root/.cache/torchinductor
      # Montaje de la suite de parches Genesis en modo lectura
      - ../vllm/_genesis:/usr/local/lib/python3.12/dist-packages/vllm/_genesis:ro
      # Template de chat Froggeric v21
      - ../templates/qwen-froggeric-chat-template.jinja:/etc/qwen-froggeric-chat-template.jinja:ro
    environment:
      # ── PARCHES GENESIS (ESTABILIDAD Y NAVEGACIÓN AGÉNTICA) ──────────────────────
      - GENESIS_ENABLE_PN56_QWEN3CODER_XML_FALLBACK=1
      - GENESIS_ENABLE_P61B_STREAMING_OVERLAP=1
      - GENESIS_ENABLE_P62_STRUCT_OUT_SPEC_TIMING=1
      - GENESIS_ENABLE_PN51_QWEN3_STREAMING_THINKING_DISABLED=1
      - GENESIS_ENABLE_PN66=1
      - GENESIS_ENABLE_PN77_FP8_LM_HEAD=1
      - GENESIS_ENABLE_P100=1
      - GENESIS_ENABLE_P5B=1
      - GENESIS_DISABLE_P5_AUTORETIRE=1
      - GENESIS_ENABLE_P69_LONG_CTX_TOOL_REMINDER=1
      - GENESIS_P68_P69_LONG_CTX_THRESHOLD_CHARS=1000
      - GENESIS_P69_REMINDER_STYLE=qwen3_coder
      - GENESIS_ENABLE_P107_MTP_TRUNCATION_DETECTOR=1
      - GENESIS_ENABLE_PN50_GDN_FUSED_PROJ=1
      - GENESIS_ENABLE_P103=1
      - GENESIS_ENABLE_PN59_STREAMING_GDN=1
      - GENESIS_ENABLE_PN54_GDN_CONTIGUOUS_DEDUP=1
      - GENESIS_ENABLE_PN57_TQ_CENTROIDS_DISK_CACHE=1

      # ── OPTIMIZACIÓN DE KERNELS GEMM / TENSOR CORES ───────────────────────────
      - VLLM_FLOAT32_MATMUL_PRECISION=high
      - VLLM_MULTI_STREAM_GEMM_TOKEN_THRESHOLD=1024
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
      - VLLM_USE_FUSED_MOE_GROUPED_TOPK=1
      - GENESIS_VERBOSE=0
      - GENESIS_LOG_LEVEL=INFO
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - VLLM_NO_USAGE_STATS=0
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
      - OMP_NUM_THREADS=1
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      - TORCHINDUCTOR_CACHE_DIR=/root/.cache/torchinductor
      - TRITON_CACHE_DIR=/root/.cache/triton
      - VLLM_USE_FLASHINFER_SAMPLER=1
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - /bin/bash
      - -c
      - |
        pip install pandas scipy xxhash -q
        python3 -m vllm._genesis.patches.apply_all
        exec vllm serve "$@"
      - --
    command:
      - cyankiwi/KAT-Coder-V2.5-Dev-AWQ-INT4
      - --served-model-name
      - qwen3.6-35b
      - --served-model-name
      - qwen3.6
      - --disable-access-log-for-endpoints
      - "/metrics,/health"
      - --attention-backend
      - FLASHINFER
      - --moe-backend
      - flashinfer_trtllm
      - --generation-config
      - vllm
      - --language-model-only
      - --quantization
      - compressed-tensors
      - --chat-template
      - /etc/qwen-froggeric-chat-template.jinja
      - --default-chat-template-kwargs
      - '{"enable_thinking": true, "auto_disable_thinking_with_tools": true}'
      - --dtype
      - float16
      - --kv-cache-dtype
      - "fp8"
      - --max-num-seqs
      - "20"
      - --disable-custom-all-reduce
      - --tensor-parallel-size
      - "2"
      - --max-model-len
      - "262144"
      - --gpu-memory-utilization
      - "0.92"
      - --enable-flashinfer-autotune
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --enable-prefix-caching
      # Prefill fragmentado en bloques de 8192 tokens.
      # 16384 -> 8192 halva el pico transitorio de los buffers FLA del GDN
      # (544 -> 272 MiB por capa) sin coste en ancho de banda: el trafico total
      # de dos chunks de 8192 es identico al de uno de 16384.
      - --enable-chunked-prefill
      - --max-num-batched-tokens
      - "8192"
      # Mitad de max-num-batched-tokens: evita que un prefill largo consuma el
      # presupuesto entero y deje sin sitio a los decodes en el mismo lote.
      - --long-prefill-token-threshold
      - "4096"
      - --performance-mode
      - "throughput"
      # Tallas de CUDA Graph explicitas, con el mismo techo que el default
      # (40 = 20 seqs x 1 x 2), para no perder cobertura de grafos mixtos.
      # Sin spec decode M = numero de secuencias, pero el default sólo tiene
      # [1,2,4,8,16,24,32,40]: 5 seqs se rellena hasta 8 (+60%) y 9 seqs hasta
      # 16 (+78%). Es el peor de los tres contenedores en este aspecto.
      # Esta lista es exacta para 1-8 seqs: relleno medio 27.9% -> 1.1%.
      # (list[int] con nargs="+": un entero por entrada, NO separados por comas)
      - --cudagraph-capture-sizes
      - "1"
      - "2"
      - "3"
      - "4"
      - "5"
      - "6"
      - "7"
      - "8"
      - "10"
      - "12"
      - "14"
      - "16"
      - "20"
      - "24"
      - "32"
      - "40"
      - --host
      - "0.0.0.0"
      - --port
      - "8320"
      - --api-key
      - "${VLLM_API_KEY:-}"

networks:
  lanbridge:
    external: true
