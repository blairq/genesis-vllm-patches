version: '3.8'

services:
  vllm-server:
    # Imagen oficial de vLLM v0.23.0 fijada para compatibilidad con parches Genesis y Qwen 3.8
    image: vllm/vllm-openai:v0.23.0
    container_name: genesis-27b-qwen38-ektome
    # SIN restart automatico a proposito: con `restart: unless-stopped` un crash
    # por OOM se relevanta solo y el contenedor aparece "Up" a los segundos,
    # indistinguible de no haber muerto. Para detectar un reinicio del proceso:
    #   curl -s :PORT/metrics -H "Authorization: Bearer $VLLM_API_KEY" \
    #     | grep process_start_time_seconds
    ports:
      # Puerto API HTTP OpenAI expuesto localmente
      - "8320:8320"
    networks:
      lanbridge:
        # IPs estáticas interna IPv4 e IPv6
        ipv4_address: 172.20.0.228
        ipv6_address: fd00:172:20::13
    volumes:
      # Caché de pesas del modelo de HuggingFace en el host (evita re-descargas)
      - /home/usuario/Proyectos/models-cache:/root/.cache/huggingface
      # Tier 2 del cache de KV: NVMe. Aca bajan los bloques que no entran en el
      # tier de RAM, en vez de perderse y tener que re-prefillear.
      - /home/usuario/Proyectos/kv-offload:/kv-offload
      # Persistencia de cachés JIT vLLM, PyTorch, Triton y Inductor (acelera el arranque)
      - /home/usuario/.cache/vllm/qwen38-27b-autoround:/root/.cache/vllm
      - /home/usuario/.cache/torch/qwen38-27b-autoround:/root/.cache/torch
      - /home/usuario/.cache/triton/qwen38-27b-autoround:/root/.cache/triton
      - /home/usuario/.cache/torchinductor/qwen38-27b-autoround:/root/.cache/torchinductor
      # Montaje de la suite de parches Genesis en modo lectura
      - ../vllm/_genesis:/usr/local/lib/python3.12/dist-packages/vllm/_genesis:ro
    environment:
      # ── PARCHES GENESIS (ESTABILIDAD Y NAVEGACIÓN AGÉNTICA) ──────────────────────
      # PN56: Fallback de parseo XML para qwen3_coder cuando el modelo emite llamadas en formato XML
      # PN80: sonda de presupuesto de VRAM. Loguea el calculo real del tensor `h`
      # de la atencion lineal y proyecta cuantos tokens/forward mas entran con la
      # VRAM libre, con veredicto de si hay que bajar --gpu-memory-utilization.
      # PN80 (sonda de presupuesto de VRAM de GDN) DESACTIVADO. Se uso para
      # tunear --gpu-memory-utilization: es lo unico que mide la VRAM libre en
      # el punto exacto de la asignacion del transitorio. Para volver a
      # tunear, poner en 1.
      - GENESIS_ENABLE_PN80_GDN_H_BUDGET_PROBE=0
      # 1 caja cada N llamadas a la sonda. Hay 48 capas GDN por forward, asi
      # que un valor bajo emite mas de una caja POR FORWARD: con 40 salian
      # 1488 lineas en un test de 2 minutos. El camino de 'riesgo de OOM'
      # ademas tiene cooldown propio (GENESIS_PN80_TIGHT_COOLDOWN, 30s).
      - GENESIS_PN80_EVERY=2000
      - GENESIS_PN80_MIN_T=256
      # Objetivo: MiB libres despues del transitorio de cada paso. Reemplaza
      # al viejo ratio 'margen sano 1.5x', que no decia cuanta VRAM sobra --
      # que es justo lo que se tunea. 100 MiB es el minimo con el que los 3
      # engines pasaron 5 prompts de 30k en paralelo sin OOMear.
      - GENESIS_PN80_TARGET_FREE_MIB=100
      # PN81: cuota y poda del tier de disco del cache de KV. vLLM no trae
      # ninguna: root_dir crece sin techo. Poda por antiguedad (mtime) al
      # superar el limite, bajando hasta TARGET_RATIO para no podar seguido.
      - GENESIS_ENABLE_PN81_KV_DISK_QUOTA=1
      - GENESIS_KV_DISK_MAX_GB=1
      - GENESIS_KV_DISK_CHECK_EVERY=20
      - GENESIS_KV_DISK_TARGET_RATIO=0.85
      # Ancho del buffer gate_up del FFN, en elementos: 2 * intermediate_size / TP
      # = 2 * 17408 / 2 = 17408. Se pone a mano porque get_current_vllm_config()
      # no esta disponible dentro del worker en el punto donde corre la sonda.
      # Verificado contra un OOM real: fallo pidiendo 268 MiB con T~8072 tokens,
      # y 268 MiB / 8072 / 2 bytes = 17408. Sin esto PN80 avisa que no puede
      # medir el FFN y que el margen real es menor que el que reporta.
      # PN25 + PN12: pools de buffers intermedios del FFN ("Cliff 1"). Atacan el
      # sitio de OOM confirmado por traceback: el grafo compilado por inductor
      # pidiendo (T x intermediate_size 17408) fp16.
      - GENESIS_ENABLE_PN25_SILU_INDUCTOR_SAFE=1
      - GENESIS_ENABLE_PN12_FFN_INTERMEDIATE_POOL=1
      - GENESIS_ENABLE_PN56_QWEN3CODER_XML_FALLBACK=1
      # P61b: Previene fuga de tags parciales en streaming hacia clientes agenticos
      - GENESIS_ENABLE_P61B_STREAMING_OVERLAP=1
      # P62: Corrige el timing de finalización del bloque de pensamiento en decodificación especulativa
      - GENESIS_ENABLE_P62_STRUCT_OUT_SPEC_TIMING=1
      # PN51: Desactiva bloques de pensamiento en streaming al ejecutar llamadas a herramientas
      - GENESIS_ENABLE_PN51_QWEN3_STREAMING_THINKING_DISABLED=1
      # PN66: Corrige la fuga del token </think> en conversaciones multiturno
      - GENESIS_ENABLE_PN66=1
      # PN77: Cuantización FP8 del LM head -> Ahorra ~1.2 GiB de VRAM por GPU
      - GENESIS_ENABLE_PN77_FP8_LM_HEAD=1
      # P100: CUDAGraphs FULL para spec-decode -> Mejora la latencia single-stream en +5-10%
      - GENESIS_ENABLE_P100=1
      # PN8: Cuantización online del borrador MTP -> Ahorra ~1-2 GiB de VRAM por GPU
      # ⛔ PN8 (cuantizacion online del draft MTP) APAGADO A PROPOSITO.
      # Este checkpoint YA trae el MTP cuantizado (block_name_to_quantize incluye
      # mtp.layers; 21 de 29 tensores con qweight/qzeros/scales, int4 auto-round).
      # PN8 lo re-cuantizaba encima y el drafter quedaba inservible:
      #     con PN8:  acceptance_length 1.00, aceptacion 0.0%  (rechazo total)
      #     sin PN8:  acceptance_length 2.84, aceptacion 61.4%
      # PN8 sirve cuando el draft viene SIN cuantizar y se lo quiere achicar
      # online (~1 GiB/GPU); aca es destructivo. Repro: opencode-debug/mtp_hunt.py
      # - GENESIS_ENABLE_PN8_MTP_DRAFT_ONLINE_QUANT=1
      # P112: Sistema de cuantización y caché en disco de MTP con fingerprint SHA256 (0% CPU en arranques posteriores)
      # ⛔ P112 (cache en disco de la cuantizacion MTP) APAGADO: sin PN8 no hay
      # nada que cachear, y con PN8 cacheaba el resultado corrupto.
      # - GENESIS_ENABLE_MTP_QUANT_CACHE=1
      # Inerte mientras PN8 este apagado (solo lo lee ese parche). Ademas decia
      # int8 heredado del engine W8A16, y este modelo es int4.
      # - GENESIS_MTP_QUANT_FORMAT=int8
      # P5b: Estrategia de tamaño de página KV para Qwen -> Ahorra ~34% de VRAM por bloque KV
      - GENESIS_ENABLE_P5B=1
      # P69: Inyecta recordatorio de formato <tool_call> al final del último mensaje si supera el umbral
      - GENESIS_ENABLE_P69_LONG_CTX_TOOL_REMINDER=1
      # Umbral en caracteres (1000) para activar el recordatorio P69 en turnos con herramientas
      - GENESIS_P68_P69_LONG_CTX_THRESHOLD_CHARS=1000
      # Formato XML <function=...> para el parser qwen3_coder
      - GENESIS_P69_REMINDER_STYLE=qwen3_coder
      - GENESIS_ENABLE_P107_MTP_TRUNCATION_DETECTOR=1
      - GENESIS_ENABLE_PN50_GDN_FUSED_PROJ=1
      - GENESIS_ENABLE_PN59_STREAMING_GDN=1
      - GENESIS_ENABLE_PN54_GDN_CONTIGUOUS_DEDUP=1
      - GENESIS_ENABLE_PN57_TQ_CENTROIDS_DISK_CACHE=1

      # ── OPTIMIZACIÓN DE KERNELS GEMM / TENSOR CORES ───────────────────────────
      - VLLM_FLOAT32_MATMUL_PRECISION=high
      - VLLM_MULTI_STREAM_GEMM_TOKEN_THRESHOLD=1024
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
      - VLLM_USE_FUSED_MOE_GROUPED_TOPK=1
      - GENESIS_VERBOSE=0
      - GENESIS_LOG_LEVEL=INFO
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - VLLM_NO_USAGE_STATS=0
      # Evita la fragmentación de memoria en CUDA permitiendo segmentos expandibles virtuales
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
      - OMP_NUM_THREADS=1
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      - TORCHINDUCTOR_CACHE_DIR=/root/.cache/torchinductor
      - TRITON_CACHE_DIR=/root/.cache/triton
      # El README del modelo lo exige en 0 (con py3.11 ademas hay que desinstalar
      # flashinfer-python). Dejarlo en 1 es un fallo de arranque conocido.
      - VLLM_USE_FLASHINFER_SAMPLER=0
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - /bin/bash
      - -c
      - |
        pip install pandas scipy xxhash -q
        python3 -m vllm._genesis.patches.apply_all
        exec vllm serve "$@"
      - --
    command:
      # Ektome: Qwen3.8-27B GPTQ 4-bit (Marlin, group 128, desc_act=false).
      # 407 de 503 Linears en 4 bits; 96 proyecciones DeltaNet quedan en bf16
      # por alineacion de Marlin (config 'dynamic' por modulo).
      # ⚠️ transformers NO puede cargarlo: solo vLLM o SGLang.
      - Zynerji/Ektome-Qwen3.8-27B-PristinelyUncensored-GPTQ-MTP
      # Alias comun a los tres engines de qwen3.8 (w8a16-mtp, w4a16, autoround)
      # para que sean INTERCAMBIABLES: los clientes piden "qwen3.6" y se puede
      # cambiar de cuantizacion sin tocar el opencode.jsonc ni ningun cliente.
      # (El nombre quedo heredado de qwen3.6; renombrarlo es deuda pendiente y
      #  hay que hacerlo en los 3 composes + los 7 canales a la vez.)
      # --served-model-name acepta VARIOS valores en UN solo flag. Repetir el
      # flag no suma alias: argparse se queda con el ULTIMO, y por eso el
      # engine solo respondia a 'goldhub/...' aunque el compose listaba 4.
      # Asi los tres alias funcionan de verdad; 'qwen3.6' es el que usan los
      # clientes (opencode.jsonc) y hace a los engines intercambiables.
      - --served-model-name
      - qwen3.6
      - qwen3.8
      - Zynerji/Ektome-Qwen3.8-27B-PristinelyUncensored-GPTQ-MTP
      - --disable-access-log-for-endpoints
      - "/metrics,/health"
      - --trust-remote-code
      - --attention-backend
      - FLASHINFER
      - --moe-backend
      - flashinfer_trtllm
      - --generation-config
      - vllm
      - --dtype
      - float16
      # fp8_e4m3: Duplica la capacidad de almacenamiento de la KV cache vs fp16
      - --kv-cache-dtype
      - "fp8_e4m3"
      # 4 y no mas: MEDIDO 2026-08-15 con el payload real de un subagente
      # (5.390 tok, 8 tools) sobre el W8A16 -> 4 concurrentes 4/4 OK,
      # 5 concurrentes 0/5 HTTP 500 por OOM. Con el cap en 4 el exceso
      # se ENCOLA en vez de reventar (verificado 5/5, 6/6, 8/8).
      # Este modelo es INT4 (pesos ~mitad que W8A16) asi que quiza
      # tolere mas: subir SOLO si PN80 reporta margen >= 1.5x sostenido.
      - --max-num-seqs
      - "10"
      - --disable-custom-all-reduce
      # Tensor Parallelism 2: Divide el modelo al 50/50 entre las 2 GPUs RTX 3090
      - --tensor-parallel-size
      - "2"
      # Contexto máximo soportado de 262K tokens
      - --max-model-len
      - "262144"
      # Asignación de VRAM por GPU para pesas + pool de KV Cache (94% de 24GB)
      # Vision: 1 imagen por request y video en 0 — nunca se usa.
      - --limit-mm-per-prompt
      - '{"image":2,"video":0}'
      # Techo de resolucion del preprocesador de vision. El profiler de memoria
      # corre un dummy multimodal con el item MAS GRANDE permitido; sin este flag
      # usa el max_pixels del preprocessor_config.json del modelo y reserva
      # activaciones para una imagen enorme que nunca vamos a mandar.
      # 2.000.000 px ~ 1414x1414, de sobra para el contrato de una imagen/request.
      # Medido en w8a16-mtp: +5,4% de KV. Ver docs/KV-OFFLOADING.md §9.
      - --mm-processor-kwargs
      - '{"max_pixels":2000000,"min_pixels":65536}'
      # 0.94 -> 0.90 para ESTE modelo. Sus pesos son 8.8 GiB (vs 13.2 del
      # autoround), asi que a 0.94 vLLM se auto-asignaba un KV de 885.297
      # tokens que despues NO entraba: OOM en _allocate_kv_cache_tensors
      # pidiendo 916 MiB con 341 libres. Con 0.90 el presupuesto es realista
      # y el KV sigue siendo MUY superior al de los otros engines.
            # 0.78 y no 0.94: cumem hace que el profiler SOBREESTIME el KV
      # disponible en ~3.1 GiB (declaraba 14.24 cuando entraban 11.16) y
      # moria en _allocate_kv_cache_tensors. Bajar util compensa ese error.
      # Aun asi el KV queda enorme: este modelo pesa 8.8 GiB, no 13.2.
      - --gpu-memory-utilization
      - "0.761"
      - --enable-flashinfer-autotune
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      # Prefix caching
      # ── Cache de KV en dos capas ────────────────────────────────────────
      # Objetivo: que el prefijo de un hilo largo (200k+) NO se recalcule
      # cuando los subagentes llenan la VRAM. En vez de tirarse, baja a RAM y
      # de ahi al NVMe, y vuelve en segundos en lugar de 5-10 min de prefill.
      #
      # Va por --kv-transfer-config y NO por --kv-offloading-size: ese flag
      # solo setea cpu_bytes_to_use y deja el spec por defecto
      # (CPUOffloadingSpec = RAM sola, LRU). El tiering y ARC necesitan este JSON.
      #
      # eviction_policy=arc: separa lo accedido UNA vez (subagentes efimeros,
      # quedan en T1 y se desalojan primero) de lo accedido VARIAS (el hilo
      # principal, sube a T2 y queda protegido de los barridos). LRU no
      # distingue y 4 coders seguidos te empujan el prefijo.
      #
      # cpu_bytes_to_use sale de /dev/shm (shm_size del compose = 16 GB), no de
      # RAM anonima. 5 GiB deja aire para el resto del stack del host.
      # ⚠️ El tier fs NO tiene limite ni limpieza propia: root_dir crece sin
      # techo. Hay que podarlo por fuera (cron por antiguedad).
      # Requerido por OffloadingConnector cuando PYTORCH_CUDA_ALLOC_CONF usa
      # expandable_segments:True. vLLM rechaza el arranque si falta.
      # Cache de KV en dos capas: RAM (5 GiB en /dev/shm, politica ARC) + NVMe.
      # Evita re-prefillear un prefijo largo cuando los subagentes lo desalojan.
      # Requerido por OffloadingConnector con expandable_segments. Ademas es
      # NECESARIO para que la captura de CUDA graphs conviva con el offloading:
      # sin cumem, _dummy_run falla en sm.fill_(-1) con 'CUDA invalid argument'.
      - --enable-cumem-allocator
      - --kv-transfer-config
      - '{"kv_connector": "OffloadingConnector", "kv_role": "kv_both", "kv_connector_extra_config": {"spec_name": "TieringOffloadingSpec", "cpu_bytes_to_use": 5368709120, "eviction_policy": "arc", "secondary_tiers": [{"type": "fs", "root_dir": "/kv-offload"}]}}'
      - --enable-prefix-caching
      # Prefill fragmentado en bloques de 8192 tokens
      - --enable-chunked-prefill
      # 8192 -> 4096 (2026-08-15). Este flag fija el tamano del MAYOR forward, y
      # con el, el pico de los buffers transitorios del FFN. Medido: con 8192 el
      # engine OOMeaba pidiendo 268 MiB = (8072 tok x intermediate_size 17408 x
      # 2 bytes), teniendo solo 275 MiB libres. A 4096 ese buffer se parte al
      # medio (~134 MiB).
      # Es mejor palanca que --gpu-memory-utilization: acota el pico SIN sacarle
      # un solo token al KV cache. El prefill ya venia fragmentado, asi que el
      # costo es solo un poco mas de latencia en el primer chunk.
      - --max-num-batched-tokens
      - "4096"
      - --long-prefill-token-threshold
      - "4096"
      - --performance-mode
      - "throughput"
      # Tallas de CUDA Graph para max 5 seqs (5 seqs * 4 tokens = max 20)
      - --cudagraph-capture-sizes
      - "4"
      - "8"
      - "12"
      - "16"
      - "20"
      - "24"
      - "28"
      - "32"
      - "36"
      - "40"
      - --async-scheduling
      # MTP segun el README del modelo: method qwen3_5_mtp y K=1 (NO 'mtp' con K=3).
      # Su cabeza MTP son 15 tensores en bf16 SIN cuantizar (~849 MB), al reves
      # del autoround. Ganancia medida por el autor: +35%% prompts cortos, +63%% codigo.
      - --speculative-config
      - '{"method":"qwen3_5_mtp","num_speculative_tokens":1}'
      - --host
      - "0.0.0.0"
      - --port
      - "8320"
      - --api-key
      - "${VLLM_API_KEY:-}"

networks:
  lanbridge:
    external: true
