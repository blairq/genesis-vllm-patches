# Override: el mismo comando SIN --speculative-config (sin DFlash2), para medir prefill como el 24-09
services:
  vllm-server:
    command: !override
      - "/root/.cache/huggingface/${IDIOTSAVANT_MODELO:-qwen3.8_27b_idiotSavant_sm_86}"
      - "--served-model-name"
      - "qwen3.8_27b_idiotSavant_sm_86"
      - "qwen3.8"
      - "qwen3.6"
      - "qwen3.8-27b-uncensored"
      - "--disable-access-log-for-endpoints"
      - "/metrics,/health"
      - "--enable-prompt-tokens-details"
      - "--trust-remote-code"
      - "--attention-backend"
      - "TRITON_ATTN"
      - "--moe-backend"
      - "flashinfer_trtllm"
      - "--generation-config"
      - "vllm"
      - "--quantization"
      - "compressed-tensors"
      - "--chat-template"
      - "/etc/qwen-froggeric-chat-template.jinja"
      - "--dtype"
      - "float16"
      - "--mamba-ssm-cache-dtype"
      - "float16"
      - "--kv-cache-dtype"
      - "int8_per_token_head"
      - "--max-num-seqs"
      - "11"
      - "--tensor-parallel-size"
      - "2"
      - "--max-model-len"
      - "262144"
      - "--gpu-memory-utilization"
      - "0.92"
      - "--limit-mm-per-prompt"
      - "{\"image\":2,\"video\":0}"
      - "--mm-processor-kwargs"
      - "{\"max_pixels\":2000000,\"min_pixels\":65536}"
      - "--enable-flashinfer-autotune"
      - "--reasoning-parser"
      - "qwen3"
      - "--enable-auto-tool-choice"
      - "--tool-call-parser"
      - "qwen3_coder"
      - "--enable-cumem-allocator"
      - "--kv-transfer-config"
      - "{\"kv_connector\": \"OffloadingConnector\", \"kv_role\": \"kv_both\", \"kv_connector_extra_config\": {\"spec_name\": \"TieringOffloadingSpec\", \"cpu_bytes_to_use\": 2147483648, \"eviction_policy\": \"arc\", \"store_threshold\": 1, \"secondary_tiers\": [{\"type\": \"fs\", \"root_dir\": \"/kv-offload\", \"n_read_threads\": 4, \"n_write_threads\": 4}]}}"
      - "--enable-prefix-caching"
      - "--profiler-config"
      - "{\"profiler\": ${PROF_KIND:-null}, \"torch_profiler_dir\": \"${PROF_DIR:-}\", \"torch_profiler_with_stack\": ${PROF_STACK:-false}, \"torch_profiler_record_shapes\": false, \"torch_profiler_use_gzip\": true, \"ignore_frontend\": true, \"delay_iterations\": ${PROF_DELAY:-0}, \"max_iterations\": ${PROF_MAX:-0}}"
      - "--enable-chunked-prefill"
      - "--max-num-batched-tokens"
      - "8192"
      - "--long-prefill-token-threshold"
      - "1760"
      - "--performance-mode"
      - "throughput"
      - "--cudagraph-capture-sizes"
      - "4"
      - "8"
      - "12"
      - "16"
      - "20"
      - "24"
      - "28"
      - "32"
      - "36"
      - "40"
      - "--async-scheduling"
      - "--scheduling-policy"
      - "priority"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8320"
      - "--api-key"
      - "${VLLM_API_KEY:-}"
