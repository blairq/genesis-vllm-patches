version: \x273.8\x27

services:
  vllm-server:
    image: vllm/vllm-openai:latest
    container_name: genesis-27b-ac
    restart: unless-stopped
    ports:
      - "8320:8320"
    networks:
      lanbridge:
        ipv4_address: 172.20.0.228
        ipv6_address: fd00:172:20::13
    volumes:
      - /home/usuario/Proyectos/club-3090/models-cache:/root/.cache/huggingface
      - /home/usuario/.cache/vllm/qwen36-27b-ac:/root/.cache/vllm
      - /home/usuario/.cache/torch/qwen36-27b-ac:/root/.cache/torch
      - /home/usuario/.cache/triton/qwen36-27b-ac:/root/.cache/triton
      - /home/usuario/.cache/torchinductor/qwen36-27b-ac:/root/.cache/torchinductor
      - ../vllm/_genesis:/usr/local/lib/python3.12/dist-packages/vllm/_genesis:ro
    environment:
      - VLLM_USE_FLASHINFER_SAMPLER=1
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - VLLM_NO_USAGE_STATS=1
      - VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=1
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
      - CUDA_DEVICE_MAX_CONNECTIONS=8
      - NCCL_CUMEM_ENABLE=0


       -NVIDIA_VISIBLE_DEVICES=all
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
      - OMP_NUM_THREADS=1
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      - NCCL_P2P_DISABLE=1
      - TORCHINDUCTOR_CACHE_DIR=/root/.cache/torchinductor
      - TRITON_CACHE_DIR=/root/.cache/triton
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - /bin/bash
      - -c
      - |
        pip install pandas scipy xxhash -q
        python3 -m vllm._genesis.patches.apply_all
        exec vllm serve "$@"
      - --
    command:
      - webhie/Qwen3.6-27B-int4-AutoRound-Code
      - --served-model-name
      - qwen3.6-27b
      - --dtype
      - auto
      - --trust-remote-code
      - --quantization
      - auto_round
      - --kv-cache-dtype
      - "fp8"
      - --max-num-seqs
      - "2"
      - --disable-custom-all-reduce
      - --tensor-parallel-size
      - "2"
      - --max-model-len
      - "212144"
      - --gpu-memory-utilization
      - "0.92"
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --speculative-config.method=mtp
      - --speculative-config.num_speculative_tokens=3
      - --generation-config=vllm
      - --enable-prompt-tokens-details
      - --host
      - "0.0.0.0"
      - --port
      - "8320"
      - --api-key
      - "${VLLM_API_KEY:-}"

networks:
  lanbridge:
    external: true
