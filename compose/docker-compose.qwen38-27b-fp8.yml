# ─────────────────────────────────────────────────────────────────────────────
# Qwen3.8-27B Uncensored FP8 (orcarouter) — copia de w8a16-mtp con otro modelo.
#
# Block-FP8 E4M3 128x128 sobre 407 de 1606 tensores. Deja en BF16 la vision
# tower, las norms, mlp.gate, lm_head, embed_tokens y TODO linear_attn (las 48
# capas GDN) — el mismo criterio que hacia gordo al autoround que borramos. Por
# eso pesa ~31 GB (15,5 GiB por GPU con TP=2) contra los 14,5 del w8a16, y va a
# rendir MENOS KV. La contrapartida es calidad: la model card mide MMLU 84,3 ->
# 84,7 y GSM8K 90,0 -> 88,7 contra la base FP8, y verifica 99,9% de codigos FP8
# identicos a los oficiales de Qwen.
#
# La MTP head esta abliterada en conjunto con el modelo, asi que el speculative
# decoding sigue sirviendo.
#
# DOS DESVIACIONES DELIBERADAS DE LA MODEL CARD:
#
#  1. Ella pide vLLM v0.24.0; este stack corre v0.23.0. El requisito real que
#     menciona es transformers >= 5.12 y el contenedor ya tiene 5.12.0. Se
#     prueba en 0.23 antes de mover la imagen, porque subir de version mueve
#     los anchors de todos los parches Genesis.
#  2. (resuelta) Se usa "mtp" como pide la card. El vLLM de este build avisa
#     que "qwen3_next_mtp" está deprecado y lo reemplaza por "mtp", así que el
#     nombre de la card es el correcto y ademas evita el warning.
#
# Se respeta lo que si dice la card: NO pasar --quantization fp8 (la config
# sale de config.json) y --kv-cache-dtype fp8.
#
# --gpu-memory-utilization: 0.76, el maximo que aguanta 5 prompts de 30k en
# paralelo. Barrido medido:
#     0.7566 -> 5/5, 0 OOMs
#     0.76   -> 5/5, 0 OOMs   <- elegido (mas KV)
#     0.775  -> 0/5, 6 OOMs, muere en el primer request
#
# OJO CON LA METRICA de "MiB libres": no es estable a esta granularidad. La
# misma config dio 19 MiB a 0.76 y 9 MiB a 0.7566 -- bajar el util dio MENOS
# libres, no mas, porque el valor depende de en que instante muestrea PN80.
# Y PN83 reportaba 1,90 GiB de margen en reposo. La unica señal confiable es
# binaria: pasa 5/5 con 0 OOMs, o no pasa.
# ─────────────────────────────────────────────────────────────────────────────
version: '3.8'

services:
  vllm-server:
    # Imagen oficial de vLLM v0.23.0 fijada para compatibilidad con parches Genesis y Qwen 3.8
    image: vllm/vllm-openai:v0.23.0
    container_name: genesis-27b-qwen38-fp8
    # SIN restart automático a propósito (2026-08-14): con `restart:
    # unless-stopped`, un crash por OOM se relevantaba solo y el contenedor
    # aparecía "Up" a los pocos segundos — indistinguible de no haber muerto.
    # Eso hizo imposible saber si un barrido de --max-num-seqs había roto o no.
    # Sin la política, un crash queda caído y visible.
    # Para detectar un reinicio del proceso sin mirar el estado del contenedor:
    #   curl -s :8320/metrics -H "Authorization: Bearer $VLLM_API_KEY" \
    #     | grep process_start_time_seconds
    # Si ese valor cambió, el proceso se reinició (y los acumulativos vllm:* se
    # resetearon a cero).
    ports:
      # Puerto API HTTP OpenAI expuesto localmente
      - "8320:8320"
    networks:
      lanbridge:
        # IPs estáticas interna IPv4 e IPv6
        ipv4_address: 172.20.0.228
        ipv6_address: fd00:172:20::13
    volumes:
      # Caché de pesas del modelo de HuggingFace en el host (evita re-descargas)
      - /home/usuario/Proyectos/models-cache:/root/.cache/huggingface
      # Tier 2 del cache de KV: NVMe. Los bloques que no entran en el tier de
      # RAM bajan acá en vez de perderse y tener que re-prefillear.
      - /home/usuario/Proyectos/kv-offload:/kv-offload
      # Persistencia de cachés JIT vLLM, PyTorch, Triton y Inductor (acelera el arranque)
      - /home/usuario/.cache/vllm/qwen38-27b-fp8:/root/.cache/vllm
      - /home/usuario/.cache/torch/qwen38-27b-fp8:/root/.cache/torch
      - /home/usuario/.cache/triton/qwen38-27b-fp8:/root/.cache/triton
      - /home/usuario/.cache/torchinductor/qwen38-27b-fp8:/root/.cache/torchinductor
      # Montaje de la suite de parches Genesis en modo lectura
      - ../vllm/_genesis:/usr/local/lib/python3.12/dist-packages/vllm/_genesis:ro
    environment:
      # ── PARCHES GENESIS (ESTABILIDAD Y NAVEGACIÓN AGÉNTICA) ──────────────────────
      # PN56: Fallback de parseo XML para qwen3_coder cuando el modelo emite llamadas en formato XML
      # PN81: el tier de disco de vLLM no tiene cuota NI limpieza (root_dir
      # crece sin techo: 38 GB en una sola sesión de pruebas). PN81 implementa
      # on_schedule_end() —hook que vLLM documenta para 'per-step cleanup' y
      # deja vacío— para podar por antigüedad, y purga al arrancar los mmap
      # huérfanos de /dev/shm que deja un cierre abrupto (llenarlo mata el
      # arranque siguiente con 'madvise: Bad address').
      # CORRECCION 2026-08-21: la cuota NO es por rank. Decia que con TP=2 el
      # disco total era 2 x MAX_GB, y es 1 x MAX_GB. TieringOffloadingSpec.
      # get_manager() se llama desde un unico sitio (offloading/scheduler.py:265,
      # OffloadingConnectorScheduler), asi que existe UN FileSystemTierManager,
      # en el proceso scheduler, con rank 0. En /kv-offload solo aparece _r0.
      # Lo que si es por rank es el mmap de RAM, que se crea aparte en
      # create_handlers() del lado del worker -- de ahi venia la confusion.
      - GENESIS_ENABLE_PN81_KV_DISK_QUOTA=1
      - GENESIS_KV_DISK_MAX_GB=30
      # Chequeo por TIEMPO, no por pasos del scheduler. El gate viejo era
      # CHECK_EVERY=2000 pasos, y on_schedule_end solo suma pasos cuando hay
      # trafico: con el engine ocioso la cuota NUNCA corria. Medido: 22 min y
      # 61 requests no llegaron a 2000 pasos, y el dir toco 31,4 GiB con
      # limite de 30 sin una sola poda.
      - GENESIS_KV_DISK_CHECK_SECS=60
      # Borra las caches de OTROS modelos sin usar hace N dias. La cuota solo
      # mira el dir del modelo actual, asi que sin esto cada modelo que probas
      # deja el suyo para siempre: se habian juntado 142 GiB, 54 de un modelo
      # que ya ni estaba descargado. Por antiguedad y no por 'no es el mio',
      # para no tirar la cache del engine que usaste ayer.
      - GENESIS_KV_DISK_ORPHAN_DAYS=3
      # PERIODICA, NO SOLO AL ARRANQUE (fix 2026-08-21). Antes corria una vez
      # por proceso: un dir que quedaba huerfano DESPUES del arranque no se
      # revisaba nunca mas. Medido: al arrancar el 08-19, _3ef784eef730_r0
      # llevaba 1,6 dias sin uso (umbral 3) y se salteo con razon; dos dias
      # despues ya calificaba y sus 25,47 GiB seguian ahi. Despistaba que su
      # hermano sin datos (solo config.json) SI se habia borrado, porque nadie
      # le escribe despues de crearlo y su mtime ya tenia 3,2 dias.
      # Cadencia propia y mas lenta que la de la cuota: este barrido recorre
      # TODOS los directorios de /kv-offload, no solo el del modelo actual.
      - GENESIS_KV_DISK_ORPHAN_CHECK_SECS=3600
      - GENESIS_KV_DISK_TARGET_RATIO=0.85
      # ── PN88: telemetria de los tiers del cache de KV ────────────────────
      # El tier de disco de vLLM no publica UNA SOLA metrica: su JobResult
      # lleva job_id y success, y record_transfer solo lo alimenta el handler
      # GPU<->CPU. Sin esto, los ~1,3 TiB/dia que se escriben al NVMe solo se
      # ven contando lineas del log de PN81.
      # Publica, con labels tier/direction/agent/group:
      #   kv_tier_bytes_total · kv_tier_ops_total · kv_tier_op_seconds
      #   kv_tier_errors_total · kv_tier_lookups_total (RAM y disco SEPARADOS,
      #   que external_prefix_cache_hits fusiona) · kv_tier_promotion_refused_total
      #   kv_tier_evictions_total · kv_tier_bytes_used · kv_tier_capacity_bytes
      #   kv_tier_disk_written_bytes_total · kv_tier_disk_read_bytes_total
      #   kv_tier_disk_write_syscalls_total · kv_tier_disk_read_syscalls_total
      #   kv_tier_recurrent_blocks_skipped_total (PN93)
      #   kv_tier_recurrent_bytes_skipped_total  (PN93)
      #
      # ⚠️ PARA DESGASTE DEL SSD USAR kv_tier_disk_written_bytes_total, NO
      # kv_tier_bytes_total. El segundo se calcula AL ENCOLAR como
      # bloques x block_size y sobreestima por dos motivos a la vez:
      #   - store_block saltea el archivo si el bloque ya existe -> 0 bytes
      #     escritos y un bloque entero contado;
      #   - con PN92 lo que se escribe es el bloque comprimido (~0,56x).
      # Verificado sobre el io.py parcheado: en el caso de re-escritura el
      # viejo contaba 1 MiB y se escribieron 0; con compresion contaba 1 MiB y
      # se escribieron 594 KB (+77%). El nuevo sale del os.write.
      #
      #   bytes/dia al NVMe:
      #     rate(vllm:kv_tier_disk_written_bytes_total[5m]) * 86400
      #
      # ⚠️ El hit rate del disco hay que leerlo POR GRUPO. Con PN93 activo los
      # bloques recurrentes salteados a proposito cuentan como `miss`, y en este
      # hibrido son 3 de los 4 grupos. El hit rate que importa es el del grupo
      # de atencion (g3 en este modelo):
      #     sum(rate(vllm:kv_tier_lookups_total{tier="disk",group="3",result="hit"}[5m]))
      #   / sum(rate(vllm:kv_tier_lookups_total{tier="disk",group="3"}[5m]))
      #
      # Observacion pura: no altera ninguna asignacion ni resultado numerico.
      - GENESIS_ENABLE_PN88_KV_TIER_METRICS=1
      # Allowlist CERRADA para la label `agent`. El nombre entra por
      # kv_transfer_params.genesis_agent, o sea desde el cliente: sin lista
      # cerrada un typo en un extraBody de opencode crea una serie de
      # Prometheus nueva para siempre. Todo lo que no este aca cae en `other`,
      # y su ausencia en `unknown`. Debe seguir a los canales de opencode.
      - GENESIS_KV_AGENTS=coach,primary,primary_low,primary_high,primary_nothink,planner,planner_nothink,coder,verifier,utility,explorer,vision,art
      # PN90: la L3 SSD pasa a ser exclusiva — el bloque baja a disco solo al
      # ser desalojado de L2 RAM, y solo si el agente esta en la allowlist.
      # El ahorro REAL viene del gating por agente: store_block ya deduplica con
      # os.path.exists, asi que el write-through de upstream tambien escribia
      # cada bloque unico una sola vez.
      - GENESIS_ENABLE_PN90_KV_DISK_WRITE_GATING=1
      # Techo de RAM para snapshots de democion pendientes. Un bloque pesa
      # 27,6 MB: el tope va en bytes, no en cantidad. 512 -> 256 MB: esta RAM
      # compite directamente con L2, y la cola se drena en el mismo paso que la
      # llena, asi que ~9 bloques sobran. Al llegar al tope NO se copia el
      # bloque (antes se copiaba y despues se descartaba el mas viejo).
      - GENESIS_PN90_MAX_PENDING_MB=256
      #
      # PN91: pasados N pasos difiriendo, el request arranca con el prefijo que
      # YA esta listo en vez de seguir esperando promociones en vuelo.
      # Techo acotado: el trafico de offloading es 1,0-1,9% del wall time y esta
      # fuera del camino critico. Ataca TTFT de prefijos grandes, no throughput.
      - GENESIS_ENABLE_PN91_KV_LAZY_STREAMING=1
      # Presupuesto en SEGUNDOS: un paso del scheduler va de ~30 ms (ocioso) a
      # ~1,6 s (con prefill largo en el batch), asi que "4 pasos" no significaba
      # nada. El tope en pasos queda como red de seguridad.
      - GENESIS_PN91_MAX_DEFER_SECONDS=2.0
      - GENESIS_PN91_MAX_DEFER_STEPS=32
      #
      # PN92: instala los hooks del codec de 4 bits en fs/io.py. Dejarlo en 1
      # para que los bloques ya comprimidos SIEMPRE se puedan leer.
      - GENESIS_ENABLE_PN92_KV_FP4_COMPRESSION=1
      # ⚠️ Lo que realmente comprime al escribir es ESTE flag, y va APAGADO.
      # Medido sobre bloques reales de /kv-offload: 12,4% de error L2 relativo
      # en el grupo de atencion (ratio 0,563, grupo de 32). El KV ya corre en
      # fp8 y este hibrido no tolera menos (ver memoria kv-fp8-degrada-gdn).
      # Ademas el disco NO es el recurso escaso: 26 GB usados de 266 disponibles.
      - GENESIS_PN92_COMPRESS_ON_WRITE=0
      # Tiene que coincidir con --kv-cache-dtype o el codec se desactiva solo.
      - GENESIS_PN92_KV_DTYPE=fp8_e4m3
      # Elementos por bloque de trabajo del codec. La version anterior
      # materializaba el bloque entero en float32 (28 MB -> 116 MB) y con 16
      # hilos de escritura eso son 1,8 GB de transitorio, compitiendo con L2.
      # Con 1M elementos el pico baja a ~4 MB por hilo.
      - GENESIS_PN92_CHUNK_ELEMS=1048576
      #
      # PN93: guarda 1 de cada N fronteras de bloque en los grupos recurrentes
      # (g0/g1/g2 = linear_attn = GDN). vLLM ya los lee con
      # _sliding_window_lookup(window=1) — "Mamba depends on a single state" —
      # asi que los intermedios se guardaban y no se leian NUNCA.
      # MEDIDO: GDN son 102 de los 136 KB/token (75%). Con stride 4 el costo baja
      # a 61,6 KB/token: 2,2x mas contexto tanto en L2 RAM como en L3 SSD.
      # OJO con el stride EFECTIVO: la referencia de "ultimo bloque" tiene que
      # ser el total del PROMPT. Cuando se pasaba el num_blocks del paso, el
      # prefill fragmentado hacia que "conservar el ultimo" disparara una vez
      # POR PASO y el stride efectivo caia a 1,33 (36 de 48 bloques guardados).
      # Importa sobre todo en L2: sus 172 slots son los que topean el hit maximo
      # (~36k tokens sin PN93, ~82k con stride 4).
      # Costo: hasta N-1 bloques de recomputo cuando el hit redondea hacia abajo.
      # Con is_last arreglado ese costo es raro: el ultimo bloque del prompt
      # SIEMPRE se conserva, y en el patron agentico (cada turno agrega al
      # anterior) el punto de reanudacion es justo ese borde -> costo cero. El
      # stride solo se paga al reanudar en el MEDIO de un prefijo, o sea en
      # ramas divergentes. Por eso 8 y no 4: la RAM vale mas que el recomputo
      # ocasional. Mide `vllm:kv_tier_hit_truncated_tokens_total` y bajalo si
      # ese contador crece.
      - GENESIS_ENABLE_PN93_SPARSE_GDN=1
      # PN99: la KV baja a L2 (y por arrastre a L3) cuantizada a 4 bits,
      # con la cuantizacion corriendo EN LA GPU. 1,78x mas bloques en los
      # mismos bytes: 12 GiB pasan de 444 a 790 bloques (553k tokens), o
      # sea L2/L1 = 1,35x en vez de 0,76x.
      # OJO: cambia el layout de /dev/shm y de /kv-offload. Al prender o
      # apagar hay que BORRAR /kv-offload o los bloques viejos se leen
      # como basura. Y PN92 tiene que seguir apagado: comprimir dos veces
      # seria un desastre.
      # PN105: arregla dos bugs encadenados del reset de cache. El primero
      # es que TieringOffloadingManager no implementaba reset_cache y
      # heredaba un no-op, asi que el boton reportaba exito con L2 intacta.
      # Arreglar eso destapo el segundo: el reset del connector no limpiaba
      # los job ids por request y el EngineCore moria con KeyError en el
      # primer request posterior. Los dos van juntos en el mismo parche.
      - GENESIS_ENABLE_PN99_GPU_COMPRESSED_L2=1
      # PN100: anillo de staging. Los bloques de agentes EFIMEROS (coder,
      # explorer: sin persist_disk) salen de estos K bloques reservados al
      # final de L2, fuera del presupuesto del cache, asi que no pueden
      # desalojar el prefijo del hilo principal. El preambulo compartido de
      # cada subagente SI va al cache (se reconoce porque la clave, que es
      # hash de contenido, ya aparecio antes).
      # 240 de 790 bloques: cubre ~6 subagentes de 25k en paralelo y deja
      # 550 al cache (~386k tokens, del orden de L1).
      # 32 de 395 bloques. Con max_offload_tokens = tamano del prompt de
      # sistema, cada subagente offloadea ~3 bloques (su preambulo), asi
      # que el trafico efimero es chico y un anillo grande solo le robaria
      # cache al hilo principal.
      - GENESIS_PN100_RING_BLOCKS=32
      # BARRIDO MEDIDO 2026-08-23 (8 prompts de 25k tok, 2 pasadas identicas):
      #   PN93 apagado   21,32 GB al SSD | 1586 desalojos L2 | 0% cacheado | 139,5 s
      #   stride 8        6,17 GB        |  377             | 0% cacheado | 139,2 s
      #   stride 16       4,92 GB        |  285             | 0% cacheado | 138,0 s
      # 77% menos escrituras que sin PN93, y CERO costo medible: el tiempo es
      # el mismo y hit_truncated_tokens{recurrent="1"} no aparece en ninguno.
      # El 0% cacheado NO lo causa PN93 (pasa igual apagado): la promocion
      # disco->L2 queda inflight porque L2 esta llena. Ver la nota de L2.
      - GENESIS_PN93_GDN_CHECKPOINT_STRIDE=16
      - GENESIS_ENABLE_PN56_QWEN3CODER_XML_FALLBACK=1
      # P61b: Previene fuga de tags parciales en streaming hacia clientes agenticos
      - GENESIS_ENABLE_P61B_STREAMING_OVERLAP=1
      # P62: Corrige el timing de finalización del bloque de pensamiento en decodificación especulativa
      - GENESIS_ENABLE_P62_STRUCT_OUT_SPEC_TIMING=1
      # PN51: Desactiva bloques de pensamiento en streaming al ejecutar llamadas a herramientas
      - GENESIS_ENABLE_PN51_QWEN3_STREAMING_THINKING_DISABLED=1
      # PN66: Corrige la fuga del token </think> en conversaciones multiturno
      - GENESIS_ENABLE_PN66=1
      # PN77: Cuantización FP8 del LM head -> Ahorra ~1.2 GiB de VRAM por GPU
      - GENESIS_ENABLE_PN77_FP8_LM_HEAD=1
      # P100: CUDAGraphs FULL para spec-decode -> Mejora la latencia single-stream en +5-10%
      - GENESIS_ENABLE_P100=1
      # PN8: Cuantización online del borrador MTP.
      # APAGADO 2026-08-19: el propio Genesis lo marca "enabled but NOT
      # recommended on this GPU (may regress or no-op)", y su lógica es no-op
      # cuando el target no está online-quantized -- que es este caso (el FP8
      # sale estático del config.json, quantization=fp8). No ahorraba nada acá.
      - GENESIS_ENABLE_PN8_MTP_DRAFT_ONLINE_QUANT=0
      # P112: cuantización + caché en disco del MTP.
      # APAGADO 2026-08-19 tras auditoría (ver el encabezado de
      # vllm/_genesis/mtp_cache.py, 7 bugs con evidencia). Resumen: sobre un
      # checkpoint FP8 hacía un round-trip FP8 -> INT8 -> FP16 que dequantizaba
      # de vuelta antes de llegar a la GPU. O sea: toda la pérdida de precisión
      # del INT8, y CERO beneficio -- ni IMMA (los pesos quedaban FP16 densos),
      # ni VRAM (0 MiB), ni velocidad. El "ahorro" real eran 39 MiB en DISCO.
      # Además corrompía los weight_scale_inv del FP8 (filtro por numel>1024).
      - GENESIS_ENABLE_MTP_QUANT_CACHE=0
      - GENESIS_MTP_QUANT_FORMAT=int8
      # P66: filtra --cudagraph-capture-sizes a los divisibles por K+1.
      # ACTIVADO 2026-08-19. Con K=3 las tallas actuales (4..40) ya son todas
      # múltiplos de 4, así que hoy es NO-OP. Se activa como red de seguridad
      # para el barrido de K: sin esto, una talla no divisible por K+1 hornea
      # una rama de PREFILL dentro de un grafo de "decode uniforme" y en
      # runtime eso lee metadata de atención basura (vllm#28015).
      - GENESIS_ENABLE_P66_CUDAGRAPH_SIZE_FILTER=1
      # P5b: Estrategia de tamaño de página KV para Qwen -> Ahorra ~34% de VRAM por bloque KV
      - GENESIS_ENABLE_P5B=1
      # P69: Inyecta recordatorio de formato <tool_call> al final del último mensaje si supera el umbral
      - GENESIS_ENABLE_P69_LONG_CTX_TOOL_REMINDER=1
      # Umbral en caracteres (1000) para activar el recordatorio P69 en turnos con herramientas
      - GENESIS_P68_P69_LONG_CTX_THRESHOLD_CHARS=1000
      # Formato XML <function=...> para el parser qwen3_coder
      - GENESIS_P69_REMINDER_STYLE=qwen3_coder
      - GENESIS_ENABLE_P107_MTP_TRUNCATION_DETECTOR=1
      - GENESIS_ENABLE_PN50_GDN_FUSED_PROJ=1
      - GENESIS_ENABLE_PN59_STREAMING_GDN=1
      - GENESIS_ENABLE_PN54_GDN_CONTIGUOUS_DEDUP=1
      - GENESIS_ENABLE_PN57_TQ_CENTROIDS_DISK_CACHE=1
      # PN80: sonda de presupuesto de VRAM. Loguea el cálculo real de `h` (el
      # tensor de la atención lineal) y proyecta cuántos tokens/forward más
      # entran con la VRAM libre. Observación pura: no cambia ninguna
      # asignación. Sirve para dimensionar --max-num-seqs con números en vez
      # de a ciegas. Aviso automático cuando el margen baja de 1.5x.
      # PN80 (sonda de presupuesto de VRAM de GDN) DESACTIVADO. Se uso para
      # tunear --gpu-memory-utilization: es lo unico que mide la VRAM libre en
      # el punto exacto de la asignacion del transitorio. Para volver a
      # tunear, poner en 1.
      - GENESIS_ENABLE_PN80_GDN_H_BUDGET_PROBE=0
      # PN25 + PN12: pools de buffers intermedios del FFN ("Cliff 1"). Atacan el
      # sitio de OOM confirmado por traceback el 2026-08-15: el fallo NO es GDN
      # sino el grafo compilado por inductor pidiendo 108 MiB =
      # (T=3253 x intermediate_size 17408) fp16. PN25 documenta reducir
      # ~4,7-18 GiB de transitorios a un buffer pooleado de ~73-285 MiB.
      - GENESIS_ENABLE_PN25_SILU_INDUCTOR_SAFE=1
      - GENESIS_ENABLE_PN12_FFN_INTERMEDIATE_POOL=1
      # PN19: durante la CARGA del modelo fija max_split_size_mb=20 (el mínimo de
      # PyTorch) y lo restaura al terminar. Ataca la fragmentación de la carga,
      # que segun vllm#41268 deja 200-500 MiB inutilizables. Reemplaza al
      # max_split_size_mb:512 global del PYTORCH_CUDA_ALLOC_CONF, que es
      # redundante con expandable_segments:True.
      - GENESIS_ENABLE_PN19_SCOPED_MAX_SPLIT=1
      # intermediate_size del modelo. Sin esto PN80 no puede medir el buffer
      # gate_up del FFN. PN80 ahora lo deriva solo (sub-patch pn80_config_capture);
      # esta env queda como override manual. Con 4096 tokens de lote el FFN son
      # 142 MiB por GPU: el transitorio real es ~52 KiB/token, no ~18.
      # 1 caja cada N llamadas a la sonda. Hay 48 capas GDN por forward, asi
      # que un valor bajo emite mas de una caja POR FORWARD: con 40 salian
      # 1488 lineas en un test de 2 minutos. El camino de 'riesgo de OOM'
      # ademas tiene cooldown propio (GENESIS_PN80_TIGHT_COOLDOWN, 30s).
      - GENESIS_PN80_EVERY=2000
      - GENESIS_PN80_MIN_T=256
      # Objetivo: MiB libres despues del transitorio de cada paso. Reemplaza
      # al viejo ratio 'margen sano 1.5x', que no decia cuanta VRAM sobra --
      # que es justo lo que se tunea. 100 MiB es el minimo con el que los 3
      # engines pasaron 5 prompts de 30k en paralelo sin OOMear.
      - GENESIS_PN80_TARGET_FREE_MIB=100

      # ── OPTIMIZACIÓN DE KERNELS GEMM / TENSOR CORES ───────────────────────────
      - VLLM_FLOAT32_MATMUL_PRECISION=high
      - VLLM_MULTI_STREAM_GEMM_TOKEN_THRESHOLD=1024
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
      - VLLM_USE_FUSED_MOE_GROUPED_TOPK=1
      - GENESIS_VERBOSE=0
      - GENESIS_LOG_LEVEL=INFO
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - VLLM_NO_USAGE_STATS=0
      # Evita la fragmentación de memoria en CUDA dividiendo en segmentos expandibles
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
      - OMP_NUM_THREADS=1
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      - TORCHINDUCTOR_CACHE_DIR=/root/.cache/torchinductor
      - TRITON_CACHE_DIR=/root/.cache/triton
      - VLLM_USE_FLASHINFER_SAMPLER=1
      # ── SEMILLA DE HASH: hace persistente el tier de disco ───────────────
      # Sin esto, kv_cache_utils.py:112 hace NONE_HASH = os.urandom(32) y la
      # RAIZ de toda la cadena de hashes de bloque cambia en cada arranque.
      # Consecuencia medida: los 57 GB que hay en /kv-offload quedan
      # INALCANZABLES despues de cada reinicio -- no se borran, simplemente
      # ningun lookup vuelve a machear, hasta que PN81 los purgue por
      # antiguedad a los 3 dias. O sea, el tier 2 se reconstruia de cero cada
      # vez. vLLM ya avisa de esto por log ("PYTHONHASHSEED is not set...").
      # El valor concreto da igual; lo que importa es que sea FIJO y estable.
      - PYTHONHASHSEED=0
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - /bin/bash
      - -c
      - |
        pip install pandas scipy xxhash -q
        python3 -m vllm._genesis.patches.apply_all
        exec vllm serve "$@"
      - --
    command:
      # Modelo de Hugging Face W8A16 + MTP
      - orcarouter/Qwen3.8-27B-Uncensored-FP8
      - --served-model-name
      - qwen3.8
      - --disable-access-log-for-endpoints
      - "/metrics,/health"
      # Llena usage.prompt_tokens_details.cached_tokens en CADA respuesta, o
      # sea atribucion de cache por request en vez de solo agregados. El
      # cliente ya pide stream_options.include_usage, asi que el dato aparece
      # sin tocar nada mas. Sin este flag, serving.py:899 lo omite siempre.
      # OJO: hoy es la SUMA de hit local + KV externo. El split por origen
      # existe por request en PrefillStats (num_local_cached_tokens /
      # num_external_cached_tokens) pero output_processor.py:630 lo colapsa
      # antes de llegar a la API -- preservarlo es un parche aparte.
      - --enable-prompt-tokens-details
      - --trust-remote-code
      - --attention-backend
      - FLASHINFER
      - --moe-backend
      - flashinfer_trtllm
      - --generation-config
      - vllm
      - --dtype
      - float16
      # fp8_e4m3: Duplica la capacidad de almacenamiento de la KV cache vs fp16
      # PRUEBA: estado SSM en fp16 en vez de fp32
      - --mamba-ssm-cache-dtype
      - "float16"
      - --kv-cache-dtype
      - "fp8_e4m3"
      # ⚠️ NO SUBIR. Diagnóstico completo 2026-08-14/15 (sonda en el código).
      #
      # Hay DOS sitios de OOM distintos, no uno:
      #   (a) max-num-seqs 12 -> OOM en chunk_gated_delta_rule_fwd_h (GDN,
      #       atención lineal). h = k.new_empty(B, NT, H, V, K).
      #   (b) max-num-seqs 5 con prompts grandes -> OOM en el GRAFO COMPILADO
      #       por inductor (torch/_inductor/output_code.py), pidiendo 108 MiB.
      #       108 MiB / (intermediate_size 17408 x 2 bytes) = 3253 tokens, o sea
      #       un buffer intermedio del FFN de shape (T, 17408) fp16.
      #       Esto es "Cliff 1" (transitorios de FFN/SiluAndMul), NO "Cliff 2"
      #       (GDN). El primer diagnóstico culpaba a GDN y estaba equivocado
      #       para este caso.
      #
      # FÓRMULA MEDIDA de h (GDN), verificada con sonda sobre 200 llamadas
      # reales — sirve para calcular en vez de tantear:
      #   h_bytes_por_GPU = tokens_en_el_forward x 12,05 KiB
      #   (= NT x H x V x K x 2, con NT=T/64, H=24 -> los 48 heads GDN SÍ se
      #    reparten entre las 2 GPUs, V=K=128, fp16)
      # `h` se asigna por BATCH COMPLETO, no por secuencia: medido T=1650 con
      # nseq=2 -> un solo h de 19,5 MiB. Constante 12,0-12,1 KiB/token en todos
      # los tamaños probados.
      #
      # El KV cache NO es el límite (345k tokens libres, contextos de 4-16k).
      # Lo que falta es margen para transitorios, que viven FUERA del pool que
      # vLLM perfila con --gpu-memory-utilization y por eso no aparecen en
      # "Available KV cache memory".
      #
      # Throughput medido: 1 seq -> 88 tok/s | 5 seqs -> 308 tok/s (3,5x).
      # Con 5 seqs y prompts de ~1,4k anda bien; con ~12k OOMea.
      #
      # SIGUIENTE PASO (no aplicado aún): PN12 (FFN intermediate scratch pool) y
      # PN25 (SiluAndMul opaque-op pool) atacan exactamente el sitio (b). Ambos
      # son categoría memory_savings, sin gate de modelo y opt-in.
      #
      # 2026-08-16: se sube 4 -> 10 y SE VALIDA. Lo que cambio desde el
      # diagnostico de arriba es que PN25 y PN12 (los pools que atacan el sitio
      # (b), los transitorios del FFN) ya estan ACTIVOS en este compose, que es
      # justamente el "siguiente paso no aplicado aun" que dejaba la nota.
      #
      # COSTO medido al pasar de 4 a 10:
      #   KV en GPU        361.729 -> 344.155 tokens  (-4,9%)
      #   memoria grafos      0,79 -> 0,94 GiB        (+0,15)
      # OJO: la lista de --cudagraph-capture-sizes NO cambio y la memoria de
      # grafos igual subio. Los buffers estaticos de cada grafo escalan con
      # max_num_seqs (block tables, indices de estado GDN), no solo con la
      # talla de la batch. No alcanza con mirar las tallas.
      #
      # 10 seqs x 4 tokens/paso (MTP K=3) = 40, que es la talla mas grande
      # capturada, asi que nada cae en eager y no hace falta capturar mas.
      #
      # VALIDADO con dos cargas distintas (tests/repro/):
      #   carga_paralela.py   10 x 40k tokens de prompt -> 10/10, 0 OOMs,
      #                       643 MiB libres por GPU en el pico
      #   carga_generacion.py 10 x 4000 tokens de salida (codigo RPG) ->
      #                       10/10, 509 tok/s agregados, 50,9 por request,
      #                       MTP 72,1%, pico REAL de 10 corriendo y 0 en cola
      #
      # Con prompts GRANDES nunca llega a 10 en paralelo: se queda en 4-5. No
      # es este flag, es --max-num-batched-tokens 4096 -- un chunk de prefill
      # se come el presupuesto entero del paso y no entra nadie mas. Para
      # paralelismo real con prompts grandes hay que subir ESE, y se paga con
      # KV y con transitorio de GDN.
      #
      # Si vuelve a OOMear, el primer valor a bajar es este, no el util.
      - --max-num-seqs
      - "10"
      # PROBADO SACARLO Y NO ANDA (2026-08-17), aun con P2P funcionando:
      #   Using ['CUSTOM','PYNCCL'] all-reduce backends for group 'tp:0'
      #   Failed: Cuda error csrc/custom_all_reduce.cuh:455 'invalid argument'
      #   -> RuntimeError: Engine core initialization failed
      # OJO: tests/repro/p2p_ipc_allreduce.py da OK (all-reduce de 15,6 MiB por
      # IPC entre procesos, resultado correcto). El test NO ejercita la captura
      # de CUDA graphs, y CustomAllreduce tiene un camino aparte para eso
      # (capture() / register_graph_buffers). Ahi es donde rompe.
      # NCCL con P2P ya da la ganancia grande, asi que esto queda pendiente.
      # RE-PROBADO 2026-08-23 CON PN94 APLICADO: SIGUE FALLANDO IGUAL.
      #   Using ['CUSTOM','PYNCCL'] all-reduce backends for group 'tp:0'
      #   Failed: Cuda error csrc/custom_all_reduce.cuh:455 'invalid argument'
      # La hipotesis era que el fallo venia del error pegajoso de CUDA que
      # dejaba el cudaHostRegister del rank 1; PN94 lo elimino (los dos ranks
      # pinnean) y el CUSTOM rompe exactamente igual. Queda descartado: el
      # problema esta en capture()/register_graph_buffers, no en el pinneo.
      - --disable-custom-all-reduce
      # Tensor Parallelism 2: Divide el modelo al 50/50 entre las 2 GPUs RTX 3090
      # TP=2 NO ES UNA ELECCION, ES LO UNICO QUE HAY (probado 2026-08-17).
      # PP=2 falla al arrancar:
      #   NotImplementedError: Pipeline parallelism is not supported for
      #   this model. Supported models implement the `SupportsPP` interface.
      # En qwen3_5.py el SupportsPP lo declara Qwen3_5ForCausalLMBase (l.433,
      # texto solo). Este checkpoint resuelve a
      # Qwen3_5ForConditionalGeneration (l.554) porque trae vision tower, y
      # esa clase no lo implementa. No re-probar sin cambiar de checkpoint.
      #
      # COSTO MEDIDO de TP=2 (profile con torch, 2026-08-17): el all-reduce
      # es el 31,8% del tiempo de GPU (10,5s de 33,2s), 4.968 llamadas de
      # ncclDevKernel_AllReduce_Sum_f16_RING_LL. Son 128 all-reduce de 16 MB
      # por forward (2 por capa x 64 capas). Link real bajo carga: Gen4 x8.
      #
      # ACTUALIZADO 2026-08-23: YA HAY P2P. Con el driver 610.57.04,
      # `nvidia-smi topo -p2p rw` da OK en los dos sentidos y la topologia es
      # PIX (un solo puente PCIe). BAR1 = 32 GB por placa (ReBAR al maximo).
      # El comentario anterior decia CNS y quedo viejo. NCCL ya usa ese P2P,
      # asi que el 31,8% medido en agosto es un techo, no el numero de hoy:
      # hay que volver a perfilar antes de citarlo.
      # --disable-custom-all-reduce SIGUE puesto: el backend CUSTOM no falla
      # por falta de P2P sino en la captura de CUDA graphs
      # (custom_all_reduce.cuh:455 'invalid argument'), ver la nota de arriba.
      - --tensor-parallel-size
      - "2"
      # Contexto máximo soportado de 262K tokens
      - --max-model-len
      - "262144"
      # Asignación de VRAM por GPU para pesas + pool de KV Cache (97.5% de 24GB)
      # 0.965 -> 0.82 al activar el offloading. --enable-cumem-allocator (que
      # OffloadingConnector exige) hace que el profiler SOBREESTIME el KV
      # disponible: con 0.965 moria en _allocate_kv_cache_tensors pidiendo
      # 610 MiB con 191 libres. Bajar el util compensa ese error.
      - --gpu-memory-utilization
      # 0,755 -> 0,745 el 2026-08-23: libera ~240 MB por placa para el
      # scratch de compresion en GPU (PN99). Achicar L1 para agrandar la
      # L2 EFECTIVA es buen negocio cuando L2 es el cuello: PN98 medía
      # L2/L1 = 0,76x, o sea que sobra L1 y falta L2.
      - "0.745"
      # Visión: 1 imagen por request (el contrato de agi_vision_inspector es de
      # UNA imagen) y video en 0 — nunca se usa. El budget del encoder cache se
      # dimensiona por el ítem multimodal MÁS GRANDE, y un video pesa mucho más
      # que una imagen: acotarlo achica esa reserva.
      - --limit-mm-per-prompt
      - '{"image":2,"video":0}'
      # Techo de resolucion del preprocesador de vision. El profiler de memoria
      # corre un dummy multimodal con el item MAS GRANDE permitido; sin este flag
      # usa el max_pixels del preprocessor_config.json del modelo y reserva
      # activaciones para una imagen enorme que nunca vamos a mandar.
      # 2.000.000 px ~ 1414x1414, de sobra para el contrato de una imagen/request.
      # Medido en w8a16-mtp: +5,4% de KV. Ver docs/KV-OFFLOADING.md §9.
      - --mm-processor-kwargs
      - '{"max_pixels":2000000,"min_pixels":65536}'
      - --enable-flashinfer-autotune
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      # Prefix caching
      # ── Cache de KV en dos capas: RAM (6 GiB, ARC) + NVMe ───────────────
      #
      # 5 -> 6 GiB (2026-08-23). L2 es la variable que aparece en los DOS
      # problemas a la vez: topea el hit maximo, y con PN90 la tasa de escritura
      # al SSD ES la tasa de desalojo de L2. Sumar RAM fisica no es opcion
      # (32 GB ~ 1M ARS), asi que el resto sale de PN93.
      #
      # Techo duro: la maquina tiene 30 GB de RAM (14 en uso) y /dev/shm son
      # 16 GB. Mas de ~8 GiB aca deja el margen fino contra el OOM killer con
      # los otros contenedores corriendo.
      #
      # Capacidad efectiva medida (KB/token -> tokens que entran en 6 GiB):
      #   sin PN93                     136,0  ->   46k
      #   PN93 stride 4                 61,6  ->  102k
      #   PN93 stride 8                 51,0  ->  123k   <- config actual
      # Un hilo de 126k tokens necesita 6,1 GB con stride 8: entra justo, y
      # cuando entra deja de generar escrituras al SSD por completo.
      # Evita re-prefillear un prefijo largo cuando los subagentes lo desalojan
      # de la VRAM. Medido: 51.5s de prefill en frío vs 2.8s recuperándolo.
      # ARC separa lo accedido UNA vez (subagentes efímeros -> se desalojan
      # primero) de lo accedido VARIAS (el hilo largo -> queda protegido).
      #
      # Va por --kv-transfer-config y NO por --kv-offloading-size: ese flag solo
      # setea cpu_bytes_to_use y deja el spec por defecto (RAM sola, LRU).
      #
      # --enable-cumem-allocator es OBLIGATORIO: sin él, la captura de CUDA
      # graphs falla con 'CUDA invalid argument' en _dummy_run/sm.fill_(-1).
      # ⚠️ Efecto lateral: cumem hace que el profiler SOBREESTIME el KV
      # disponible. Si el engine empieza a OOMear en
      # _allocate_kv_cache_tensors, hay que BAJARLE --gpu-memory-utilization.
      - --enable-cumem-allocator
      - --kv-transfer-config
      # store_threshold: PROBADO EN 2 EL 2026-08-23 Y NO SIRVE. Queda en 1.
      # La idea era resistencia a escaneo: que un bloque entre a L2 recien en
      # su SEGUNDA aparicion, para que el material de un solo uso no desaloje
      # al working set. PN96 habilita el parametro (upstream lo rechazaba con
      # un ValueError), pero la MEDICION lo desmiente:
      #
      #   ocupacion de L2   6,43 GB (100%)  ->  58 MB (0,9%)
      #   ronda de relectura tras escaneo     0,0%  ->  0,0%  (sin cambio)
      #
      # Por que: `counts` se incrementa en lookup(), y lookup() solo corre
      # cuando una request BUSCA el bloque. El flujo natural es computar y
      # offloadear (store) ANTES de que nadie lo busque, asi que el contador
      # casi nunca llega a 2 antes de que pase la oportunidad de guardar.
      # Con 2 no se gana resistencia a escaneo: se desactiva L2.
      # No re-probar sin cambiar donde se incrementa el contador.
      - '{"kv_connector": "OffloadingConnector", "kv_role": "kv_both", "kv_connector_extra_config": {"spec_name": "TieringOffloadingSpec", "cpu_bytes_to_use": 6442450944, "eviction_policy": "arc", "store_threshold": 1, "secondary_tiers": [{"type": "fs", "root_dir": "/kv-offload"}]}}'
      - --enable-prefix-caching
      # Prefill fragmentado en bloques de 8192 tokens
      - --enable-chunked-prefill
      # ── TAMAÑO DEL PASO DEL SCHEDULER ────────────────────────────────
      #
      # EL QUANTUM ES block_size (1600), NO UN NUMERO REDONDO. Con
      # mamba_cache_mode=align todo chunk de prefill largo se trunca a
      # multiplo de block_size:
      #     scheduler.py _mamba_block_aligned_split:  n = n // 1600 * 1600
      # Asi que el viejo "4096" nunca fue 4096: eran 2,56 bloques que el
      # scheduler recortaba a 2 (3200), mientras el profiler reservaba
      # transitorio para los 4096 completos. Por eso los valores van en
      # MULTIPLOS de 1600.
      #
      # Pisos duros (probados): por debajo de 1600 el engine NO arranca
      #   "In Mamba cache align mode, block_size (1600) must be <=
      #    max_num_batched_tokens (1024)"   (config/vllm.py validate_block_size)
      # y con el threshold por debajo de 1600 es peor: 1024//1600*1600 = 0, el
      # request no recibe tokens nunca y se cuelga SIN error.
      #
      # BARRIDO MEDIDO (tests/repro/carga_mixta.py, hilo de 126k + 5 agentes,
      # threshold fijo en 1x, latencia inter-token por streaming):
      #
      #   presup.  KV        TTFT agentes  inter-token  hilo largo
      #   1x1600   361.729   127,4s          51 ms      133,9s   <- elegido
      #   2x3200   352.942     3,2s        1615 ms      136,4s
      #   3x4800   339.762     3,3s        1676 ms      136,9s
      #   4x6400   328.046     3,2s        1635 ms      136,4s
      #   (piso con el engine ocioso: 31 ms)
      #
      # NO es un gradiente, son DOS regimenes:
      #  - 1x: el chunk del hilo largo se come el presupuesto ENTERO, los
      #    agentes ni entran al batch. Esperan a que termine el prefill y
      #    despues corren casi como en vacio (51 ms vs 31 ms).
      #  - 2x en adelante: sobra presupuesto, los agentes entran a los 3,2s y
      #    quedan atrapados en el lockstep a ~1,6s POR TOKEN, que es lo que
      #    tarda el paso con un chunk de 1600 de prefill adentro.
      #    2x, 3x y 4x son indistinguibles entre si: una vez que hay sobrante
      #    para admitirlos, agrandar el presupuesto solo cuesta KV.
      #
      # Para un agente de ~90 tokens el TIEMPO TOTAL decide:
      #   1x: 127,4s de espera + 90 x 51 ms   = 132s
      #   2x:   3,2s de espera + 90 x 1615 ms = 148s
      # 1x gana en total, da el KV mas alto de las cuatro y el hilo largo
      # termina antes. Lo unico que pierde es el TTFT: no se ve nada durante
      # dos minutos y despues sale todo junto. Para subagentes que hacen tool
      # calls y no muestran texto en vivo, el total es lo que importa.
      # Si algun dia importa el TTFT (streaming a la vista del usuario), la
      # config es 2x3200 y se paga con 8.787 tokens de KV.
      #
      # PISO QUE NO SE PUEDE BAJAR: con un prefill largo en el batch, el tick
      # no baja de ~1,6s porque el chunk minimo es 1600 y eso viene de la
      # pagina de mamba ("Setting attention block size to 1600 tokens to
      # ensure that attention page size is >= mamba page size"). Solo lo
      # rompe --mamba-cache-mode != align, que a cambio pierde prefix caching
      # en las capas GDN -- mal negocio para el patron de un hilo largo.
      #
      # LO QUE NO ES EL PROBLEMA (medido, para no volver a buscar ahi):
      #  - El tiempo del prompt largo no depende de esto: 133,9 / 136,4 /
      #    136,9 / 136,4s en las cuatro configs. El prefill esta pegado al
      #    techo de computo (~770 tok/s = 41,6 de los 71 TFLOPS fp16 de dos
      #    3090; la 3090 es Ampere y NO tiene tensor cores FP8, asi que los
      #    pesos se desempaquetan a fp16: se gana memoria, no computo).
      #  - El trafico GPU<->CPU del offloading: 15,44 GiB por corrida en
      #    1,3-2,5s = 1,0-1,9% del tiempo de pared, y FUERA del camino
      #    critico (save_kv_layer y wait_for_save son no-op; los stores se
      #    difieren y corren en streams aparte, v1/kv_offload/cpu/
      #    gpu_worker.py:372).
      - --max-num-batched-tokens
      # 2026-08-19: 832 -> 1664 (x2, múltiplo exacto del bloque de 832).
      # ADVERTENCIA: las mediciones de más arriba en este mismo archivo dicen
      # que esto NO acelera el prefill (133,9 / 136,4 / 136,9 / 136,4s en las
      # cuatro configs: está pegado al techo de cómputo, ~770 tok/s). Y con
      # max_num_partial_prefills=1 tampoco hay prefills concurrentes que
      # aprovechen el presupuesto mayor. El costo SÍ es real: el profiler mide
      # el pico de activaciones con este número, así que sale de la KV.
      # Revertir a "832" si la KV baja y no aparece ganancia medida.
      - "1664"
      # Redundante con el presupuesto (los dos en 1x) pero explicito a
      # proposito: si algun dia se sube el presupuesto, esto deja el chunk del
      # prefill largo en 1 bloque en vez de seguirlo hacia arriba.
      - --long-prefill-token-threshold
      - "832"
      - --performance-mode
      - "throughput"
      # Tallas de CUDA Graph. Con MTP num_speculative_tokens=3 cada secuencia
      # aporta 4 tokens por paso, así que 40 cubre hasta 10 seqs.
      # Se probó extender a 48 (para 12 seqs) el 2026-08-14 y se revirtió junto
      # con max-num-seqs: capturar 2 tallas más costaba +0,26 GiB de memoria de
      # grafos (0,79 -> 1,05 GiB), que es justo la que faltó al OOMear.
      - --cudagraph-capture-sizes
      - "4"
      - "8"
      - "12"
      - "16"
      - "20"
      - "24"
      - "28"
      - "32"
      - "36"
      - "40"
      - --async-scheduling
      # Decodificación especulativa MTP nativa con 3 tokens borrador por paso
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
      - --host
      - "0.0.0.0"
      - --port
      - "8320"
      - --api-key
      - "${VLLM_API_KEY:-}"

networks:
  lanbridge:
    external: true
