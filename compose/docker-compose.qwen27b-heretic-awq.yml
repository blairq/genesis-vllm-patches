version: '3.8'

services:
  vllm-server:
    image: vllm/vllm-openai:v0.23.0
    container_name: genesis-27b-heretic-awq
    restart: unless-stopped
    ports:
      - "8320:8320"
    networks:
      lanbridge:
        ipv4_address: 172.20.0.228
        ipv6_address: fd00:172:20::13
    volumes:
      - /home/usuario/Proyectos/club-3090/models-cache:/root/.cache/huggingface
      - /home/usuario/.cache/vllm/qwen36-27b-heretic:/root/.cache/vllm
      - /home/usuario/.cache/torch/qwen36-27b-heretic:/root/.cache/torch
      - /home/usuario/.cache/triton/qwen36-27b-heretic:/root/.cache/triton
      - /home/usuario/.cache/torchinductor/qwen36-27b-heretic:/root/.cache/torchinductor
      - ../vllm/_genesis:/usr/local/lib/python3.12/dist-packages/vllm/_genesis:ro
      - /home/usuario/Proyectos/club-3090/models/qwen3.6-27b/vllm/patches/froggeric-chat-template/chat_template.jinja:/etc/qwen-froggeric-chat-template.jinja:ro
      - /home/usuario/Proyectos/requant/models/Qwen3.6-27B-uncensored-heretic-v2-Native-MTP-Preserved-AWQ-W4A16:/models/Qwen3.6-27B-uncensored-heretic-v2-Native-MTP-Preserved-AWQ-W4A16:ro
    environment:
      # Fixes tool-call/streaming validados en vLLM 0.23.0 (dry-run 2026-07-04,
      # ver /home/usuario/Proyectos/opencode-debug/DIAGNOSTICO.md).
      # Los flags son individuales por patch — GENESIS_ENABLE_PATCHES=<lista> no existe.
      # PN56 = fallback XML del parser (wiring original genesis).
      # NO activar el pack consolidado P64+P61c de sndr en 0.23.0: probado
      # 2026-07-04, REGRESIÓN — el parser deja de reconocer tool calls bien
      # formados tras contenido previo (el gate <0.23.0 de sndr es correcto).
      - GENESIS_ENABLE_PN56_QWEN3CODER_XML_FALLBACK=1
      - GENESIS_ENABLE_P61B_STREAMING_OVERLAP=1
      - GENESIS_ENABLE_P62_STRUCT_OUT_SPEC_TIMING=1
      - GENESIS_ENABLE_PN51_QWEN3_STREAMING_THINKING_DISABLED=1
      # P69 re-anclado a vLLM 0.23.0 el 2026-07-04: reminder de formato <tool_call>
      # al final del último user msg cuando hay tools y el prompt supera el umbral.
      # Reemplaza al inject_proxy externo. Umbral 10K chars (default 50K no cubre
      # el primer turno de opencode, ~31K chars, donde se reprodujo la falla).
      # Portados de sndr_core_engine 2026-07-04 (anchors 0.23.x):
      # PN66 = fix leak </think> multi-turn | PN348 (default-ON) = dedup backbone MTP ~1GB/GPU
      # Pendientes de activar tras benchmark: PN77 (lm_head FP8), P100 (FULL cudagraph spec-decode)
      # - GENESIS_ENABLE_PN66=1
      - GENESIS_ENABLE_PN77_FP8_LM_HEAD=1
      # P100 apagado 2026-07-04 (decisión operador): neutro bajo carga y sus
      # ~416MiB de cudagraphs van al KV/prefix cache (~+30K tokens, prioridad
      # declarada: cache hits). Re-activable para A/B de latencia single-stream.
      # - GENESIS_ENABLE_P100=1
      - GENESIS_ENABLE_P69_LONG_CTX_TOOL_REMINDER=1
      # Umbral 1000 (antes 8000): el middleware cuenta solo chars de mensajes
      # (sin schemas de tools). Con 8000 no disparaba en los prompts custom de
      # opencode (~2-3K chars) y el modelo anunciaba la delegación por texto
      # sin emitir el <tool_call> (reproducido 2026-07-14, test RPG). Con 1000
      # el reminder de formato aplica en la práctica a todo turno con tools.
      - GENESIS_P68_P69_LONG_CTX_THRESHOLD_CHARS=1000
      # Estilo XML <function=...> para el parser qwen3_coder de este engine
      # (el default "json" enseña un formato que este parser no parsea)
      - GENESIS_P69_REMINDER_STYLE=qwen3_coder
      # NO aplican en vLLM 0.23.0 (anchor drift, requieren re-anclado o ya mergeados upstream):
      # P107, P64, P59, PN58 (mutuamente excluyente con P62), PN66, P68/P69
      - GENESIS_VERBOSE=1
      - GENESIS_LOG_LEVEL=DEBUG
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - VLLM_NO_USAGE_STATS=0
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
      - OMP_NUM_THREADS=1
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      # TEST A (bench 2026-07-04): P2P habilitado — GPUs en PXB tras switch Broadcom PEX880xx
      # - NCCL_P2P_DISABLE=1
      - TORCHINDUCTOR_CACHE_DIR=/root/.cache/torchinductor
      - TRITON_CACHE_DIR=/root/.cache/triton
      - VLLM_ATTENTION_BACKEND=FLASHINFER
      - VLLM_USE_FLASHINFER_SAMPLER=1
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - /bin/bash
      - -c
      - |
        pip install pandas scipy xxhash -q
        python3 -m vllm._genesis.patches.apply_all
        exec vllm serve "$@"
      - --
    command:
      - /models/Qwen3.6-27B-uncensored-heretic-v2-Native-MTP-Preserved-AWQ-W4A16
      - --served-model-name
      - qwen3.6-27b
      - --served-model-name
      - qwen3.6
      - --chat-template
      - /etc/qwen-froggeric-chat-template.jinja
      - --default-chat-template-kwargs
      - '{"enable_thinking": true, "auto_disable_thinking_with_tools": true}'
      - --dtype
      - float16
      - --quantization
      - compressed-tensors
      - --kv-cache-dtype
      - "fp8"
      - --max-num-seqs
      - "20"
      - --disable-custom-all-reduce
      - --tensor-parallel-size
      - "2"
      - --max-model-len
      - "262144"
      - --gpu-memory-utilization
      - "0.96"
      - --enable-flashinfer-autotune
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --enable-prefix-caching
      - --enable-chunked-prefill
      # TEST C (bench 2026-07-04): 8192 causó CUDA OOM bajo carga con gpu-mem-util 0.96 — REVERTIDO a 4096
      - --max-num-batched-tokens
      - "4096"
      - --performance-mode
      - "throughput"
      - --async-scheduling
      - --speculative-config
      - '{"method":"qwen3_next_mtp","num_speculative_tokens":3}'
      - --host
      - "0.0.0.0"
      - --port
      - "8320"
      - --api-key
      - "${VLLM_API_KEY:-}"

networks:
  lanbridge:
    external: true
