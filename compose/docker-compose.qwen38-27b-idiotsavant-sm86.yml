# ─────────────────────────────────────────────────────────────────────────────
# qwen3.8_27b_idiotSavant_sm_86 + qwen3.8_27b_idiotSavant_sm_86_dflash2
# vLLM v0.29.0 + parches Genesis, 2x RTX 3090 (sm_86), TP=2
#
# El modelo: Qwen3.8-27B sin censura (orcarouter) en W4 GPTQ con el RESIDUO ROTADO
# (Hadamard por bloques, estilo QuaRot), servido como W4A8: pesos int4 x activaciones
# int8 por token en Marlin. KL sobre respuestas vs BF16: 0,0194 (el int4 de AutoRound
# de noon: 0,0385), misma velocidad. Como se arma y por que: entrenamiento/idiotsavant/
# (README.md y DECISIONES.md).
#   HF: https://huggingface.co/BlairQ/qwen3.8_27b_idiotSavant_sm_86
#       https://huggingface.co/BlairQ/qwen3.8_27b_idiotSavant_sm_86_dflash2
#
# Lo IMPRESCINDIBLE para este checkpoint:
#   GENESIS_ENABLE_PN148_ROT_DOWN=1      Hadamard 512 antes de down_proj (sin eso: basura)
#   GENESIS_ENABLE_PN149_ROT_BORRADOR=1  el borrador comparte embedding/lm_head rotados
#   VLLM_MARLIN_INPUT_DTYPE=int8         W4A8 (sin esto corre W4A16: anda, algo mas lento)
# Todo lo demas es el stack de rendimiento/agente de este rig (medido en la memoria
# del proyecto); se puede apagar por separado.
#
# Cosas a saber:
#   * Mismo IP (172.20.0.228) y puerto (8360) que el compose de noon: no corren juntos.
#   * Al cambiar de checkpoint VACIAR /home/usuario/Proyectos/kv-offload: el directorio
#     del offload se identifica por el nombre del modelo, no por los pesos.
#   * Caches JIT propias (vLLM, torch, Triton, Inductor): el cambio de modelo invalida
#     torch.compile y los kernels; mezclarlas arrastraria artefactos de otro modelo.
# ─────────────────────────────────────────────────────────────────────────────
version: '3.8'

services:
  vllm-server:
    image: vllm/vllm-openai:v0.29.0
    container_name: genesis-27b-idiotsavant
    # Sin swap (en cgroup v2 la perilla es memswap_limit == mem_limit) y con los nucleos
    # fisicos de un solo socket para el proceso servidor.
    mem_limit: 26g
    memswap_limit: 26g
    cpuset: "0-7,16-23"
    ports:
      - "8360:8320"
    networks:
      lanbridge:
        ipv4_address: 172.20.0.228       # Traefik y los clientes (opencode, Hermes) apuntan aca
        aliases:
          - vllm-server
    volumes:
      - /home/usuario/Proyectos/models-cache:/root/.cache/huggingface     # modelo y borrador
      - /home/usuario/Proyectos/kv-offload:/kv-offload                    # tier de disco de la KV
      - /home/usuario/.cache/vllm/qwen38-27b-idiotsavant-sm86-v029:/root/.cache/vllm
      - /home/usuario/.cache/torch/qwen38-27b-idiotsavant-sm86-v029:/root/.cache/torch
      - /home/usuario/.cache/triton/qwen38-27b-idiotsavant-sm86-v029:/root/.cache/triton
      - /home/usuario/.cache/torchinductor/qwen38-27b-idiotsavant-sm86-v029:/root/.cache/torchinductor
      - ../vllm/_genesis:/usr/local/lib/python3.12/dist-packages/vllm/_genesis:ro   # los parches
      # trazas de medicion: la captura para reajustar el borrador escribe aca (ov-captura.yml)
      - /home/usuario/Proyectos/genesis-vllm-patches/tests/bench/medicion/trazas:/traces
      - ../templates/qwen-froggeric-chat-template.jinja:/etc/qwen-froggeric-chat-template.jinja:ro
    environment:
      # ── el checkpoint rotado ────────────────────────────────────────────────
      - GENESIS_ENABLE_PN148_ROT_DOWN=1          # Hadamard 512 antes de down_proj; con SK-23 sale
                                                 # int8 directo a Marlin (+1,4% prefill)
      - GENESIS_ENABLE_PN149_ROT_BORRADOR=1      # borrador en su base original sobre el target rotado
      # ── lineales W4A8 (Marlin) ──────────────────────────────────────────────
      - VLLM_MARLIN_INPUT_DTYPE=int8             # activaciones int8 por token: W4A8
      - VLLM_MARLIN_USE_ATOMIC_ADD=1
      - GENESIS_ENABLE_PN130_MARLIN_S16=1        # Marlin propio: tope de registros, reduccion int32
                                                 # entre warps (+11% prefill), corr inicializado
      - GENESIS_ENABLE_PN125_MARLIN_W4A8_ESCALAS=1   # escalas negativas de AutoRound: aca no hay
                                                     # (GPTQ las deja positivas), no hace nada
      - GENESIS_ENABLE_PN139_LM_HEAD_INT4=1      # lm_head int4 g128 al cargar (rotado da el mismo error)
      - GENESIS_ENABLE_PN77_FP8_LM_HEAD=1        # camino fp8 del lm_head (PN139 lo reemplaza)
      - GENESIS_ENABLE_PN108_DRAFT_FP8_LM_HEAD=0
      - GENESIS_ENABLE_PN118_INT8_MLP=0          # MLP int8 para checkpoints AWQ: no aplica
      - GENESIS_ENABLE_PN119_SK12_MLP=0          # SK-12 necesita pesos int8 de PN118
      - GENESIS_ENABLE_PN116_PREFILL_MLP_SK=0
      # ── atencion: KV int8 por token-cabeza con decode entero (SK-18) ────────
      - GENESIS_ENABLE_PN131_SK18=1
      - GENESIS_PN131_NATIVO=1                   # registrado como backend nativo (en el proceso que sirve)
      - GENESIS_PN131_BMAX=11
      - GENESIS_ENABLE_PN124_TRITON_AMPERE=1     # TRITON_ATTN rapido en Ampere (head 256)
      - GENESIS_ENABLE_PN126_ROT_QK=1            # Hadamard de q/k tras RoPE (la KV int8 la necesita)
      - GENESIS_PN126_ROT=hadamard
      # ── TP=2: all-reduce ────────────────────────────────────────────────────
      - GENESIS_ENABLE_PN120_AR_INT8=1           # all-reduce int8 en el prefill (+6,5%)
      - GENESIS_PN120_M_MIN=512
      - GENESIS_PN120_GRUPO=64
      - GENESIS_ENABLE_B3_CUSTOM_AR=1            # all-reduce propio para TP=2 con fallback
      # ── especulativo: DFlash2 + arbol de 8 nodos ────────────────────────────
      - GENESIS_ENABLE_PN142_DFLASH2=1           # DFlash2 usable en v0.29.0
      - GENESIS_PN144_ESCALA_RESIDUAL=32         # el residual del borrador desborda fp16 sin esto
      - GENESIS_ENABLE_ARBOL=1                   # arbol de borrador (+10-11% prosa)
      - GENESIS_ARBOL_CERRADA=0
      - GENESIS_ENABLE_PN147_SANEO_SPEC=1        # min_p/logit_bias/thinking_budget_message con spec decode
      - GENESIS_ENABLE_PN145_SW_BLOCK_SIZE=1     # bloque de ventana deslizante alineado (mas KV)
      - GENESIS_ENABLE_PN146_GROUP_SIZE=1        # grupo de KV 8 (el borrador imponia 5)
      - GENESIS_PN146_GROUP_SIZE=8
      - GENESIS_ENABLE_PN122_GDN_CINTA=1         # rollback del estado GDN con cinta (+7,6% KV)
      - GENESIS_ENABLE_PN127_MAMBA_DROP_EAGLE=1
      - GENESIS_ENABLE_PN128_GDN_MTP_ASYNC_ORDER=1
      - GENESIS_ENABLE_B5_REJECTION_SAMPLER=1
      - GENESIS_ENABLE_P82=1
      - GENESIS_ENABLE_P58_ASYNC_PLACEHOLDER_FIX=0   # mataba la aceptacion en v0.29.0
      - GENESIS_ENABLE_PN8_MTP_DRAFT_ONLINE_QUANT=0
      - GENESIS_ENABLE_P107_MTP_TRUNCATION_DETECTOR=1
      - GENESIS_ENABLE_PN114_MAMBA_ALIGN_BOUNDS_GUARD=1
      - GENESIS_PN114_GUARD_BLOCK_TABLE=0
      # ── offload de KV: RAM (2 GB) -> disco ──────────────────────────────────
      - GENESIS_ENABLE_PN81_KV_DISK_QUOTA=1      # tope y poda del tier de disco
      - GENESIS_KV_DISK_MAX_GB=40                # 40 y no 64: con el disco justo, 64 lo llena
      - GENESIS_KV_DISK_CHECK_SECS=60
      - GENESIS_KV_DISK_ORPHAN_DAYS=3
      - GENESIS_KV_DISK_ORPHAN_CHECK_SECS=3600
      - GENESIS_KV_DISK_TARGET_RATIO=0.85
      - GENESIS_PN81_ASYNC=1
      - GENESIS_ENABLE_PN88_KV_TIER_METRICS=1    # (upstream ya lo trae: se saltea solo)
      - GENESIS_KV_AGENTS=coach,primary,primary_low,primary_high,primary_nothink,planner,planner_nothink,coder,verifier,utility,explorer,vision,art
      - GENESIS_ENABLE_PN90_KV_DISK_WRITE_GATING=1
      - GENESIS_PN90_MAX_PENDING_MB=256
      - GENESIS_ENABLE_PN91_KV_LAZY_STREAMING=1
      - GENESIS_PN91_MAX_DEFER_SECONDS=15.0
      - GENESIS_PN91_MAX_DEFER_STEPS=400
      - GENESIS_PN100_RING_BLOCKS=32             # anillo de staging del offload
      - GENESIS_DISABLE_PN97=1                   # trababa el offload
      - GENESIS_ENABLE_PN92_KV_FP4_COMPRESSION=0
      - GENESIS_ENABLE_PN93_SPARSE_GDN=0
      - GENESIS_ENABLE_PN99_GPU_COMPRESSED_L2=0
      - GENESIS_ENABLE_PN121_PREEMPT_GUARD=1     # corta la cascada de preempcion por frees diferidos
      # ── scheduling: TTFT de prompts cortos, admision por headroom ───────────
      - GENESIS_ENABLE_PN115_PID_GATING=1
      - GENESIS_PN115_KV_GATING=1
      - GENESIS_PN115_LATENCY_PID=0
      - GENESIS_PN115_MAX_CONCURRENT_PREFILLS=1
      - GENESIS_PN115_PROMPT_CORTO_TOKENS=2000
      - GENESIS_PID_HEADROOM_RATIO=0.10
      - GENESIS_PID_MIN_CONCURRENCY=2
      - GENESIS_PID_HIGH_PRIO_THRESHOLD=0
      # ── grafos CUDA ─────────────────────────────────────────────────────────
      - GENESIS_ENABLE_P66_CUDAGRAPH_SIZE_FILTER=1
      - GENESIS_P66_GENERAR_TALLAS=1
      - GENESIS_P66_MAX_REQS=4
      - GENESIS_ENABLE_B2_FULL_CG=0
      - GENESIS_ENABLE_P100=0
      - GENESIS_ENABLE_PN129_FLASHINFER_DECODE_UNPIN=0
      # ── tools, razonamiento y streaming (agente de codigo) ──────────────────
      - GENESIS_ENABLE_PN56_QWEN3CODER_XML_FALLBACK=1
      - GENESIS_ENABLE_P59_QWEN3_TOOL_RECOVERY=1
      - GENESIS_ENABLE_P69_LONG_CTX_TOOL_REMINDER=1  # recordatorio de formato de tools en contexto largo
      - GENESIS_P68_P69_LONG_CTX_THRESHOLD_CHARS=1000
      - GENESIS_P69_REMINDER_STYLE=qwen3_coder
      - GENESIS_ENABLE_PN51_QWEN3_STREAMING_THINKING_DISABLED=1
      - GENESIS_ENABLE_PN66=1                    # fuga de </think> en multiturno
      - GENESIS_ENABLE_P61B_STREAMING_OVERLAP=1
      - GENESIS_ENABLE_P62_STRUCT_OUT_SPEC_TIMING=1
      - GENESIS_ENABLE_P5B=1
      # ── GDN y memoria ───────────────────────────────────────────────────────
      - GENESIS_ENABLE_PN50_GDN_FUSED_PROJ=1
      - GENESIS_ENABLE_PN54_GDN_CONTIGUOUS_DEDUP=1
      - GENESIS_ENABLE_PN59_STREAMING_GDN=1
      - GENESIS_PN59_MIN_T=256
      - GENESIS_ENABLE_PN80_GDN_H_BUDGET_PROBE=0
      - GENESIS_ENABLE_PN25_SILU_INDUCTOR_SAFE=1
      - GENESIS_ENABLE_PN12_FFN_INTERMEDIATE_POOL=1
      - GENESIS_ENABLE_PN19_SCOPED_MAX_SPLIT=1   # (upstream ya lo trae: se saltea solo)
      - GENESIS_ENABLE_PN57_TQ_CENTROIDS_DISK_CACHE=1
      - GENESIS_ENABLE_B7_LM_HEAD=0
      # ── diagnostico ─────────────────────────────────────────────────────────
      - GENESIS_VOLCADO=1                        # si algo revienta, deja los locales del frame
      - GENESIS_VOLCADO_DIR=/root/.cache/vllm/genesis_volcados
      - GENESIS_DIAG_LMHEAD=0
      - VLLM_LOGGING_CONFIG_PATH=/root/.cache/vllm/genesis_logs/logging.json
      - VLLM_LOGGING_LEVEL=INFO
      - GENESIS_VERBOSE=0
      - GENESIS_LOG_LEVEL=INFO
      # ── vLLM / torch ────────────────────────────────────────────────────────
      - VLLM_FLOAT32_MATMUL_PRECISION=high
      - VLLM_MULTI_STREAM_GEMM_TOKEN_THRESHOLD=1024
      - VLLM_USE_FUSED_MOE_GROUPED_TOPK=1
      - VLLM_USE_FLASHINFER_SAMPLER=1
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - VLLM_NO_USAGE_STATS=0
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
      - CUDA_DEVICE_SCHEDULE=1
      - OMP_NUM_THREADS=1
      - PYTHONHASHSEED=0
      - TORCHINDUCTOR_CACHE_DIR=/root/.cache/torchinductor
      - TRITON_CACHE_DIR=/root/.cache/triton
      # ── claves (del .env; nunca en el archivo) ──────────────────────────────
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      - GENESIS_ADMIN_API_KEY=${GENESIS_ADMIN_API_KEY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    # Sano = genera de verdad (no solo /health): 16 tokens con la clave.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          n=$$(curl -sf -m 120 http://localhost:8320/v1/completions
          -H 'Content-Type: application/json'
          -H "Authorization: Bearer $${VLLM_API_KEY}"
          -d '{"model":"qwen3.8","prompt":"La capital de Francia es","max_tokens":16,"temperature":0}'
          | python3 -c "import sys,json;print(json.load(sys.stdin)['usage']['completion_tokens'])"
          2>/dev/null) && [ "$${n:-0}" -gt 5 ]
      interval: 60s
      timeout: 130s
      retries: 2
      start_period: 900s
    restart: unless-stopped
    shm_size: "16gb"
    ipc: host
    cap_add:
      - SYS_PTRACE
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Los parches se aplican en un proceso aparte y despues se hace exec de vllm serve
    # (lo que se registra en memoria lo carga vllm._genesis.plugins_arranque en cada proceso).
    entrypoint:
      - /bin/bash
      - -c
      - |
        pip install pandas scipy xxhash -q
        VLLM_LOGGING_CONFIG_PATH= python3 -m vllm._genesis.volcado
        python3 -m vllm._genesis.patches.apply_all
        exec vllm serve "$@"
      - --
    command:
      - /root/.cache/huggingface/qwen3.8_27b_idiotSavant_sm_86
      - --served-model-name
      - qwen3.8_27b_idiotSavant_sm_86
      - qwen3.8                        # alias que usan opencode, Hermes y el healthcheck
      - qwen3.6
      - qwen3.8-27b-uncensored
      - --disable-access-log-for-endpoints
      - "/metrics,/health"
      - --enable-prompt-tokens-details
      - --trust-remote-code
      - --attention-backend
      - TRITON_ATTN                    # PN131 (SK-18) corre sobre TRITON_ATTN
      - --moe-backend
      - flashinfer_trtllm
      - --generation-config
      - vllm
      - --quantization
      - compressed-tensors
      - --chat-template
      - /etc/qwen-froggeric-chat-template.jinja
      - --dtype
      - float16
      - --mamba-ssm-cache-dtype
      - "float16"
      - --kv-cache-dtype
      - "int8_per_token_head"          # KV int8: 4x menos error que fp8 y +30% decode a 50k
      - --max-num-seqs
      - "11"
      - --tensor-parallel-size
      - "2"
      - --max-model-len
      - "262144"
      - --gpu-memory-utilization
      - "0.92"
      - --limit-mm-per-prompt
      - '{"image":2,"video":0}'
      - --mm-processor-kwargs
      - '{"max_pixels":2000000,"min_pixels":65536}'
      - --enable-flashinfer-autotune
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --enable-cumem-allocator
      # offload de KV: 2 GB de RAM + disco (/kv-offload), con los PN81/PN90/PN91 de arriba
      - --kv-transfer-config
      - '{"kv_connector": "OffloadingConnector", "kv_role": "kv_both", "kv_connector_extra_config": {"spec_name": "TieringOffloadingSpec", "cpu_bytes_to_use": 2147483648, "eviction_policy": "arc", "store_threshold": 1, "secondary_tiers": [{"type": "fs", "root_dir": "/kv-offload", "n_read_threads": 4, "n_write_threads": 4}]}}'
      - --enable-prefix-caching
      # profiler apagado salvo PROF_KIND/PROF_DIR en el entorno
      - --profiler-config
      - '{"profiler": ${PROF_KIND:-null}, "torch_profiler_dir": "${PROF_DIR:-}", "torch_profiler_with_stack": false, "torch_profiler_record_shapes": false, "torch_profiler_use_gzip": true, "ignore_frontend": true, "delay_iterations": ${PROF_DELAY:-0}, "max_iterations": ${PROF_MAX:-0}}'
      - --enable-chunked-prefill
      - --max-num-batched-tokens
      - "8192"
      - --long-prefill-token-threshold
      - "1760"                         # con PN115: los prompts cortos no esperan detras de uno largo
      - --performance-mode
      - "throughput"
      - --cudagraph-capture-sizes
      - "4"
      - "8"
      - "12"
      - "16"
      - "20"
      - "24"
      - "28"
      - "32"
      - "36"
      - "40"
      - --async-scheduling
      - --scheduling-policy
      - priority
      # borrador DFlash2 reajustado contra este modelo; K=8 es el optimo medido para
      # contextos de agente de 60-100k (hereda el kv-cache-dtype del target)
      - --speculative-config
      - '{"method":"dflash","model":"/root/.cache/huggingface/qwen3.8_27b_idiotSavant_sm_86_dflash2","num_speculative_tokens":8}'
      - --host
      - "0.0.0.0"
      - --port
      - "8320"
      - --api-key
      - "${VLLM_API_KEY:-}"

networks:
  lanbridge:
    external: true
