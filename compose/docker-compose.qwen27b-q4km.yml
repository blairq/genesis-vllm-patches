# ===========================================================================
# Profile (at-a-glance):
#   Model:     Qwen3.6-27B-Q4_K_M (Unsloth GGUF, ~15.6 GB)
#   Engine:    vLLM (Genesis patches) con soporte GGUF
#   Topology:  Dual 3090 (TP=2)
#   KV:        fp8_e5m2
#   Max ctx:   32768
#   Status:    ✅ Ready
#   Best for:  Inferencia eficiente 27B con MTP en dual GPU, GGUF Q4_K_M.
# ---------------------------------------------------------------------------
# Copia de docker-compose.yml del genesis actual con modelo reemplazado
# por Qwen3.6-27B-Q4_K_M (Unsloth GGUF).
# ===========================================================================

version: '3.8'

services:
  vllm-server:
    image: vllm/vllm-openai:latest
    container_name: genesis-27b-q4km
    restart: unless-stopped
    ports:
      - "8319:8319"
    networks:
      lanbridge:
        ipv4_address: 172.20.0.227
        ipv6_address: fd00:172:20::12
    volumes:
      - /home/usuario/Proyectos/club-3090/models-cache:/root/.cache/huggingface
      - ./cache/triton:/root/.triton/cache
      - ./cache/compile:/root/.cache/vllm/torch_compile_cache
      - ../vllm/_genesis:/usr/local/lib/python3.12/dist-packages/vllm/_genesis:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - VLLM_NO_USAGE_STATS=1
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True,max_split_size_mb:512
      - OMP_NUM_THREADS=1
      - VLLM_API_KEY=${VLLM_API_KEY:-}
    shm_size: "16gb"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    entrypoint:
      - /bin/bash
      - -c
      - |
        pip install pandas scipy xxhash -q
        python3 -m vllm._genesis.patches.apply_all
        exec vllm serve "$@"
      - --
    command:
      - --model
      - "/root/.cache/huggingface/qwen3.6-27b-gguf/unsloth-q4km/Qwen3.6-27B-Q4_K_M.gguf"
      - --served-model-name
      - qwen3.6-27b
      - --quantization
      - gguf
      - --dtype
      - float16
      - --tensor-parallel-size
      - "2"
      - --max-model-len
      - "32768"
      - --gpu-memory-utilization
      - "0.92"
      - --max-num-seqs
      - "2"
      - --max-num-batched-tokens
      - "8192"
      - --kv-cache-dtype
      - fp8_e5m2
      - --trust-remote-code
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
      - --host
      - "0.0.0.0"
      - --port
      - "8319"
      - --api-key
      - "${VLLM_API_KEY:-}"

networks:
  lanbridge:
    external: true
